<div class="setting-header">
  <h3 class="setting-title">{{ "names.groupSetting" | translate }}</h3>
  <div class="setting-actions">
    <button
      mat-raised-button
      class="dense"
      [disabled]="noData"
      color="primary"
      (click)="onSave()"
    >
      {{ "names.save" | translate }}
    </button>
    <button
      mat-raised-button
      class="dense"
      [disabled]="noData"
      (click)="onRevert()"
    >
      {{ "names.revert" | translate }}
    </button>
  </div>
</div>

<ng-container *ngIf="ready">
  <div class="sub-bar">
    <mat-label>{{ "names.selectedGroup" | translate }}</mat-label>
    <mat-form-field class="index-selector dense" appearance="outline">
      <mat-select [disabled]="noData" [(value)]="selectedItem">
        <mat-option *ngFor="let item of groups" [value]="item">{{
          item.id
        }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="assign-grid">
    <oms-unit-picker
      [title]="'names.homePointList' | translate"
      [unitName]="'names.point' | translate"
      [pool]="points"
      [disabled]="noData"
      [picked]="assignedPoints"
      (selectionChanged)="onChange('points', $event)"
    ></oms-unit-picker>
    <oms-unit-picker
      [title]="'names.stationList' | translate"
      [unitName]="'names.station' | translate"
      [pool]="stations"
      [disabled]="noData"
      [picked]="assignedStations"
      (selectionChanged)="onChange('stations', $event)"
    ></oms-unit-picker>
    <oms-unit-picker
      [title]="'names.vehicleList' | translate"
      [unitName]="'names.vehicle' | translate"
      [pool]="vehicles"
      [disabled]="noData"
      [picked]="assignedVehicles"
      (selectionChanged)="onChange('vehicles', $event)"
    ></oms-unit-picker>
    <oms-unit-picker
      [title]="'names.bufferList' | translate"
      [unitName]="'names.buffer' | translate"
      [pool]="buffers"
      [disabled]="noData"
      [picked]="assignedBuffers"
      (selectionChanged)="onChange('buffers', $event)"
    ></oms-unit-picker>
  </div>
</ng-container>
