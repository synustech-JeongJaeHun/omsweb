<div class="setting-header">
  <h3 class="setting-title">{{ "names.clusterSetting" | translate }}</h3>
  <div class="setting-actions">
    <button
      mat-raised-button
      class="dense"
      color="primary"
      [disabled]="!canSave"
      (click)="onSave()"
    >
      {{ "names.save" | translate }}
    </button>
    <button
      mat-raised-button
      class="dense"
      [disabled]="!canSave"
      (click)="onRevert()"
    >
      {{ "names.revert" | translate }}
    </button>
  </div>
</div>

<div class="sub-bar">
  <mat-label>{{ "names.selectedCluster" | translate }}</mat-label>
  <mat-form-field class="index-selector dense" appearance="outline">
    <mat-select [(value)]="selectedItem">
      <mat-option *ngFor="let item of clusters" [value]="item">{{
        item.id
      }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div class="assign-grid">
  <oms-unit-picker
    [title]="'names.point' | translate"
    [unitName]="'names.point' | translate"
    [gridHeight]="440"
    [pool]="points"
    [picked]="assignedPoints"
    (selectionChanged)="onAssignChanged($event)"
  ></oms-unit-picker>
  <div class="max-vehicle">
    <h5>{{ "names.maxVehicles" | translate }}</h5>
    <mat-form-field class="dense" appearance="outline">
      <input
        #maxVehiclesInput
        matInput
        type="number"
        [value]="selectedItem?.maxVehicles"
        min="0"
        (change)="onMaxVehiclesChanged(maxVehiclesInput.value)"
      />
    </mat-form-field>
  </div>
</div>
