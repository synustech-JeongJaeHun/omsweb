<div class="setting-header">
  <h3 class="setting-title">{{ "names.clusterSetting" | translate }}</h3>
  <div class="setting-actions">
    <button mat-raised-button class="dense" color="primary">Save</button>
    <button mat-raised-button class="dense">Revert</button>
  </div>
</div>

<div class="sub-bar">
  <mat-label>{{ "names.selectedCluster" | translate }}</mat-label>
  <mat-form-field class="index-selector dense" appearance="outline">
    <mat-select [value]="1">
      <mat-option [value]="1">1</mat-option>
      <mat-option [value]="2">2</mat-option>
      <mat-option [value]="3">3</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div class="assign-grid">
  <oms-unit-picker
    [title]="'names.point' | translate"
    [unitName]="'names.point' | translate"
    [gridHeight]="440"
  ></oms-unit-picker>
  <div class="max-vehicle">
    <h5>{{ "names.maxVehicles" | translate }}</h5>
    <mat-form-field class="dense" appearance="outline">
      <input matInput type="number" value="6" />
    </mat-form-field>
  </div>
</div>
