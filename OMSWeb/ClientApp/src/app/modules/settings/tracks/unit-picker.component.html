<h5>{{ title }}</h5>

<div class="assign-container" >
  <div *ngIf="visibleUnassigned" class="unassigned-list">
    <dx-data-grid
      [dataSource]="pool"
      [disabled]="disabled"
      [showBorders]="true"
      [(selectedRowKeys)]="selectedUnassignedIds"
      [height]="gridHeight"
      [width]="widthUnassigned"
    >
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-selection
        [mode]="selectionModeUnassigned"
        showCheckBoxesMode="always"
      ></dxo-selection>
      <dxi-column
        [width]="widthColumnUnassigned"
        alignment="center"
        [caption]="unitName"
        cellTemplate="idTemplate"
      >
      </dxi-column>
      <div class="item-text" *dxTemplate="let data of 'idTemplate'">
        {{ data.data }}
      </div>
    </dx-data-grid>
  </div>
  <div *ngIf="visibleAction" class="actions">
    <button mat-icon-button (click)="onUnassign()" [disabled]="disabled">
      <mat-icon>arrow_left</mat-icon>
    </button>
    <button mat-icon-button (click)="onAssign()" [disabled]="disabled">
      <mat-icon>arrow_right</mat-icon>
    </button>
  </div>
  <div *ngIf="visibleAssigned" class="assigned-list" >
    <dx-data-grid
      [dataSource]="picked"
      [disabled]="disabled"
      [showBorders]="true"
      [(selectedRowKeys)]="selectedAssignedIds"
      [height]="gridHeight"
      [width]="widthAssigned"
    >
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-selection
        [mode]="selectionModeAssigned"
        showCheckBoxesMode="always"
      ></dxo-selection>
      <dxi-column
        [width]="widthColumnAssigned"
        alignment="center"
        [caption]="unitName"
        cellTemplate="idTemplate"
      >
      </dxi-column>
      <div class="item-text" *dxTemplate="let data of 'idTemplate'">
        {{ data.data }}
      </div>
    </dx-data-grid>
  </div>
</div>
