<oms-dialog-base [title]="'names.settings' | translate">
  <div class="dialog-layout">
    <mat-drawer-container class="settings-container" autosize>
      <mat-drawer #drawer class="settings-sidenav" mode="side" opened>
        <mat-nav-list>
          <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="['settings', { outlets: { sub: ['users'] } }]"
            class="nav-link"
            >{{ "names.userManagement" | translate }}</a
          >

          <mat-divider class="nav-divider"></mat-divider>

          <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="[
              'settings',
              { outlets: { sub: ['tracks', 'group'] } }
            ]"
            class="nav-link"
            >{{ "names.group" | translate }}</a
          >
          <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="[
              'settings',
              { outlets: { sub: ['tracks', 'cluster'] } }
            ]"
            class="nav-link"
            >{{ "names.cluster" | translate }}</a
          >
          <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="[
              'settings',
              { outlets: { sub: ['tracks', 'alarms'] } }
            ]"
            class="nav-link"
            >{{ "names.alarmList" | translate }}</a
          >
          <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="[
              'settings',
              { outlets: { sub: ['tracks', 'segment'] } }
            ]"
            class="nav-link"
            >{{ "names.segment" | translate }}</a
          >
          <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="[
              'settings',
              { outlets: { sub: ['tracks', 'node'] } }
            ]"
            class="nav-link"
            >{{ "names.node" | translate }}</a
          >
          <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="['settings', { outlets: { sub: ['tracks', 'zcu'] } }]"
            class="nav-link"
            >{{ "names.zcu" | translate }}</a
          >
          <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="[
              'settings',
              { outlets: { sub: ['tracks', 'station'] } }
            ]"
            class="nav-link"
            >{{ "names.station" | translate }}</a
          >
          <!-- <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="[
              'settings',
              { outlets: { sub: ['tracks', 'buffer'] } }
            ]"
            class="nav-link"
            >{{ "names.buffer" | translate }}</a
          > -->
          <!-- <a
            mat-list-item
            routerLinkActive="active"
            [routerLink]="[
              'settings',
              { outlets: { sub: ['tracks', 'blockzone'] } }
            ]"
            class="nav-link"
            >{{ "names.blockZone" | translate }}</a
          > -->
        </mat-nav-list>
      </mat-drawer>

      <div class="settings-content">
        <router-outlet name="sub"></router-outlet>
      </div>
    </mat-drawer-container>
  </div>
</oms-dialog-base>
