<oms-dialog-base [title]="'names.bulkAddUser' | translate">
  <ng-container class="dialog-layout">
    <div mat-dialog-content>
      <div>
        <a href="../../../../assets/files/oms-bulkuser.csv" download>{{"names.csv" | translate}} {{"names.download" |
          translate}}</a>
      </div>
      <input type="file" name="CSV File Upload" (change)="fileChangeListner($event.srcElement.files)" accept=".csv" />
      <div>
        <mat-label>{{ csvValidationMessages }}</mat-label>
      </div>
    </div>

    <table *ngIf="csvTableData.length > 0">
      <thead>
        <tr>
          <th>User Id</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Email</th>
          <th>Password</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of csvTableData">
          <td>{{row[0]}}</td>
          <td>{{row[1]}}</td>
          <td>{{row[2]}}</td>
          <td>{{row[3]}}</td>
          <td>****</td>
          <td>{{row[5]}}</td>
        </tr>
      </tbody>

    </table>

    <div mat-dialog-actions>
      <button type="submit" mat-raised-button color="primary" (click)="importToGrid()">
        {{ "names.save" | translate }}
      </button>
      <button type="button" mat-raised-button mat-dialog-close>
        {{ "names.cancel" | translate }}
      </button>
    </div>
  </ng-container>
</oms-dialog-base>
