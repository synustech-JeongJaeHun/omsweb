<div id="loading-bar" *ngIf="loadingState">
  Loading ...
  <mat-progress-bar
    mode="indeterminate"
    aria-label="Loading"
  ></mat-progress-bar>
</div>

<oms-map-viewer
  *ngIf="ready"
  [preference]="mapPreference"
  [viewMode]="viewMode"
  [trackData]="trackData"
  class="map-viewer"
></oms-map-viewer>

<div id="status-control" *ngIf="showControlTable">
  <oms-status-control></oms-status-control>
</div>
