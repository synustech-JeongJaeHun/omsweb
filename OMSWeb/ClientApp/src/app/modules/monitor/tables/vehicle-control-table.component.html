<div class="grid-actions" *ngIf="hasControlAccess">
  <button
    mat-stroked-button
    color="warn"
    class="dense accent"
    [disabled]="!canControl"
    (click)="onEStop()"
  >
    {{ "names.estop" | translate }}
  </button>
  <button
    mat-stroked-button
    color="primary"
    class="dense accent"
    [disabled]="!canControl"
    (click)="onReset()"
  >
    {{ "names.reset" | translate }}
  </button>
  <button
    mat-stroked-button
    color="primary"
    class="dense accent"
    [disabled]="!canControl"
    (click)="onSetAuto()"
  >
    {{ "names.auto" | translate }}
  </button>
  <button
    mat-stroked-button
    color="primary"
    class="dense"
    [disabled]="!canControl"
    (click)="onChangeHostOrderActivity()"
  >
    {{ "names.hostOrderEnable" | translate }}
  </button>
  <button
    mat-stroked-button
    color="primary"
    class="dense"
    [disabled]="!canControl"
    (click)="onChangePushActivity()"
  >
    {{ "names.pushEnable" | translate }}
  </button>
  <button
    mat-stroked-button
    color="primary"
    class="dense"
    [disabled]="!canControl"
    (click)="onRailIn()"
  >
    {{ "names.railIn" | translate }}
  </button>
  <button
    mat-stroked-button
    color="primary"
    class="dense"
    [disabled]="!canControl"
    (click)="onRailOut()"
  >
    {{ "names.railOut" | translate }}
  </button>
</div>

<dx-data-grid
  [dataSource]="dataSource"
  [remoteOperations]="true"
  [height]="tableHeight"
  [repaintChangesOnly]="false"
  [columnAutoWidth]="false"
  [showBorders]="false"
  [highlightChanges]="false"
  [showColumnLines]="true"
  [showRowLines]="true"
  [headerFilter]="false"
  [(selectedRowKeys)]="selectedRows"
>
  <dxo-scrolling mode="virtual" rowRenderingMode="standard"></dxo-scrolling>
  <dxo-paging [pageSize]="50"></dxo-paging>
  <dxo-pager
    [showPageSizeSelector]="true"
    [allowedPageSizes]="[50, 100, 200]"
    [showInfo]="true"
    visible="true"
  ></dxo-pager>
  <dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
  <dxo-search-panel
    [placeholder]="'names.search' | translate"
    [visible]="true"
  ></dxo-search-panel>
  <dxo-load-panel [enabled]="false"></dxo-load-panel>

  <dxi-column
    [allowFiltering]="false"
    [width]="80"
    dataType="string"
    dataField="id"
    sortOrder="desc"
    [caption]="'names.id' | translate"
  ></dxi-column>
  <dxi-column
    [width]="120"
    dataType="string"
    dataField="physicalId"
    [caption]="'names.physicalId' | translate"
  ></dxi-column>
  <dxi-column
    [width]="80"
    dataType="string"
    dataField="mode"
    [caption]="'names.mode' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="80"
    dataType="boolean"
    dataField="canBePushed"
    [caption]="'names.canBePushed' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="80"
    dataType="string"
    dataField="orderOrigin"
    [caption]="'names.orderOrigin' | translate"
  ></dxi-column>
  <dxi-column
    [width]="60"
    dataType="string"
    dataField="curPoint"
    [caption]="'names.curPoint' | translate"
  ></dxi-column>
  <dxi-column
    [width]="60"
    dataType="string"
    dataField="commandPoint"
    [allowSorting]="false"
    [caption]="'names.commandPoint' | translate"
  ></dxi-column>
  <dxi-column
    [width]="70"
    dataType="string"
    dataField="orderId"
    [allowSorting]="false"
    [caption]="'names.orderId' | translate"
  ></dxi-column>
  <dxi-column
    [width]="70"
    dataType="string"
    dataField="locationPickup"
    [caption]="'names.locationPickup' | translate"
  ></dxi-column>
  <dxi-column
    [width]="70"
    dataType="string"
    dataField="locationDropoff"
    [caption]="'names.locationDropoff' | translate"
  ></dxi-column>
  <dxi-column
    [width]="100"
    dataType="string"
    dataField="movingState"
    [allowSorting]="false"
    [caption]="'names.movingState' | translate"
  ></dxi-column>
  <dxi-column
    [width]="100"
    dataType="string"
    dataField="cargoState"
    [allowSorting]="false"
    [caption]="'names.cargoState' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="number"
    dataField="distanceTotal"
    [allowSorting]="false"
    [caption]="'names.distanceTotal' | translate"
  ></dxi-column>
</dx-data-grid>
