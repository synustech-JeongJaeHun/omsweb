<div class="grid-actions">
  <button mat-flat-button color="primary" class="dense">{{'names.delete'|translate}}</button>
</div>

<dx-data-grid
  [dataSource]="dataSetResult?.items"
  [height]="tableHeight"
  [repaintChangesOnly]="true"
  [columnAutoWidth]="true"
  [showBorders]="false"
  [highlightChanges]="false"
  [showColumnLines]="true"
  [showRowLines]="true"
  [(selectedRowKeys)]="selectedRows"
>
  <dxo-scrolling mode="virtual"></dxo-scrolling>
  <dxo-paging [pageSize]="10"></dxo-paging>
  <dxo-header-filter [visible]="false"></dxo-header-filter>
  <dxo-pager
    [showPageSizeSelector]="true"
    [allowedPageSizes]="[50, 100, 200]"
    [showInfo]="true"
    visible="true"
  ></dxo-pager>
  <dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
  <dxo-search-panel
    [placeholder]="'names.search'|translate"
    [visible]="true"
  ></dxo-search-panel>

  <dxi-column
    [allowFiltering]="false"
    [width]="80"
    dataType="string"
    dataField="id"
    [caption]="'names.id' | translate"
  ></dxi-column>
  <dxi-column
    [width]="100"
    dataType="string"
    dataField="state"
    [caption]="'names.state' | translate"
    ></dxi-column>
    <dxi-column
    [width]="80"
    dataType="string"
    dataField="vehicle_id"
    [caption]="'names.vehicle_id' | translate"
    [customizeText]="transformVehicleId"
    ></dxi-column>
    <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="string"
    dataField="location_pickup"
    [caption]="'names.location_pickup' | translate"
    [customizeText]="transformLocationId"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="string"
    dataField="location_dropoff"
    [caption]="'names.location_dropoff' | translate"
    [customizeText]="transformLocationId"
  ></dxi-column>
  <dxi-column
    [width]="80"
    dataType="string"
    dataField="priority"
    [caption]="'names.priority' | translate"
  ></dxi-column>
  <dxi-column
    dataType="string"
    dataField="carrier_label"
    [allowSorting]="false"
    [caption]="'names.carrier_label' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="datetime"
    dataField="time_created"
    [allowSorting]="false"
    [caption]="'names.time_created' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="datetime"
    dataField="time_assigned"
    [allowSorting]="false"
    [caption]="'names.time_assigned' | translate"
  ></dxi-column>
</dx-data-grid>
