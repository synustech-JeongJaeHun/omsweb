<div class="grid-actions">
  <button mat-flat-button color="primary" class="dense">
    {{ "names.delete" | translate }}
  </button>
</div>

<dx-data-grid
  [dataSource]="dataSource"
  [remoteOperations]="true"
  keyExpr="id"
  [height]="tableHeight"
  [repaintChangesOnly]="true"
  [columnAutoWidth]="true"
  [showBorders]="false"
  [highlightChanges]="false"
  [showColumnLines]="true"
  [showRowLines]="true"
  [hoverStateEnabled]="true"
  [(selectedRowKeys)]="selectedRows"
>
  <dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
  <dxo-scrolling mode="virtual"></dxo-scrolling>
  <dxo-paging [pageSize]="10"></dxo-paging>
  <dxo-header-filter [visible]="false"></dxo-header-filter>
  <dxo-pager
    [showPageSizeSelector]="true"
    [allowedPageSizes]="[50, 100, 200]"
    [showInfo]="true"
    visible="true"
  ></dxo-pager>
  <dxo-search-panel
    [placeholder]="'names.search' | translate"
    [visible]="true"
  ></dxo-search-panel>

  <dxi-column
    [allowFiltering]="false"
    [width]="80"
    dataType="string"
    dataField="id"
    [caption]="'names.id' | translate"
  ></dxi-column>
  <dxi-column
    [width]="100"
    dataType="string"
    dataField="state"
    [caption]="'names.state' | translate"
  ></dxi-column>
  <dxi-column
    [width]="80"
    dataType="string"
    dataField="vehicleId"
    [caption]="'names.vehicleId' | translate"
    [customizeText]="transformVehicleId"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="string"
    dataField="locationPickup"
    [caption]="'names.locationPickup' | translate"
    [customizeText]="transformLocationId"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="string"
    dataField="locationDropoff"
    [caption]="'names.locationDropoff' | translate"
    [customizeText]="transformLocationId"
  ></dxi-column>
  <dxi-column
    [width]="80"
    dataType="string"
    dataField="priority"
    [caption]="'names.priority' | translate"
  ></dxi-column>
  <dxi-column
    dataType="string"
    dataField="carrierLabel"
    [allowSorting]="false"
    [caption]="'names.carrierLabel' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="datetime"
    dataField="timeCreated"
    [allowSorting]="false"
    [caption]="'names.timeCreated' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="datetime"
    dataField="timeAssigned"
    [allowSorting]="false"
    [caption]="'names.timeAssigned' | translate"
  ></dxi-column>
</dx-data-grid>
