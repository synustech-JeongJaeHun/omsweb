<div class="grid-actions">
  <button mat-flat-button color="primary" class="dense">Delete</button>
</div>

<dx-data-grid
  [dataSource]="dataSetResult?.items"
  [height]="tableHeight"
  [repaintChangesOnly]="true"
  [columnAutoWidth]="true"
  [showBorders]="true"
  [highlightChanges]="false"
  [showColumnLines]="true"
  [showRowLines]="true"
  [(selectedRowKeys)]="selectedRows"
>
  <dxo-scrolling mode="virtual"></dxo-scrolling>
  <dxo-paging [pageSize]="10"></dxo-paging>
  <dxo-header-filter [visible]="true"></dxo-header-filter>
  <dxo-pager
    [showPageSizeSelector]="true"
    [allowedPageSizes]="[50, 100, 200]"
    [showInfo]="true"
    visible="true"
  ></dxo-pager>
  <dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
  <dxo-search-panel
    [placeholder]="'Search'"
    [visible]="true"
  ></dxo-search-panel>

  <dxi-column
    [width]="80"
    dataType="string"
    dataField="id"
    [caption]="'common.id' | translate"
  ></dxi-column>
  <!-- <dxi-column
    [width]="100"
    dataType="string"
    dataField="OrderType"
    [caption]="'_TYPE' | translate"
    ></dxi-column> -->
    <!-- [customizeText]="transformOrderType" -->
  <dxi-column
    [width]="100"
    dataType="string"
    dataField="state"
    [caption]="'common.state' | translate"
    ></dxi-column>
    <!-- [customizeText]="transformOrderStatus" -->
  <dxi-column
    [width]="80"
    dataType="string"
    dataField="vehicle_id"
    [caption]="'common.vehicle_id' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="string"
    dataField="location_pickup"
    [caption]="'common.location_pickup' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="string"
    dataField="location_pickup"
    [caption]="'common.location_pickup_name' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="string"
    dataField="location_dropoff"
    [caption]="'common.location_dropoff' | translate"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="false"
    [width]="120"
    dataType="string"
    dataField="location_dropoff"
    [caption]="'common.location_dropoff_name' | translate"
  ></dxi-column>
  <dxi-column
    [width]="80"
    dataType="string"
    dataField="priority"
    [caption]="'common.priority' | translate"
  ></dxi-column>
  <dxi-column
    dataType="string"
    dataField="carrier_label"
    [allowSorting]="false"
    [caption]="'common.carrier_label' | translate"
  ></dxi-column>
  <dxi-column
    [width]="120"
    dataType="datetime"
    dataField="time_created"
    [allowSorting]="false"
    [caption]="'common.time_created' | translate"
  ></dxi-column>
  <dxi-column
    [width]="120"
    dataType="datetime"
    dataField="time_assigned"
    [allowSorting]="false"
    [caption]="'common.time_assigned' | translate"
  ></dxi-column>
</dx-data-grid>
