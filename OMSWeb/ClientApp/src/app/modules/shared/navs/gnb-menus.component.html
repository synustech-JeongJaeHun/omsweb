<div class="main-navs">
  <button
    mat-icon-button
    class="nav-item"
    matTooltipClass="gnb-tooltip"
    matTooltipPosition="below"
    matTooltip="Monitor"
    routerLinkActive="active"
    routerLink="/monitor/status"
  >
    <mat-icon>monitor</mat-icon>
  </button>
  <button
    mat-icon-button
    class="nav-item"
    matTooltipClass="gnb-tooltip"
    matTooltipPosition="below"
    matTooltip="Control"
    routerLinkActive="active"
    routerLink="/controls"
    [disabled]="!hasPermission(39)"
  >
    <mat-icon fontSet="material-icons-outlined">layers</mat-icon>
  </button>
  <button
    mat-icon-button
    class="nav-item"
    matTooltipClass="gnb-tooltip"
    matTooltipPosition="below"
    matTooltip="Playback"
    routerLinkActive="active"
    routerLink="/playback"
    [disabled]="!hasPermission(5)"
  >
    <mat-icon>play_circle_outline</mat-icon>
  </button>
  <button
    mat-icon-button
    class="nav-item"
    matTooltipClass="gnb-tooltip"
    matTooltipPosition="below"
    matTooltip="History"
    routerLinkActive="active"
    routerLink="/histories"
    [disabled]="!hasPermission(4)"
  >
    <mat-icon>history</mat-icon>
  </button>

  <button
    mat-icon-button
    class="nav-item"
    matTooltipClass="gnb-tooltip"
    matTooltipPosition="below"
    matTooltip="Logs"
    routerLinkActive="active"
    routerLink="/logs"
    [disabled]="!hasPermission(6)"
  >
    <mat-icon>receipt_long</mat-icon>
    <!-- <mat-icon>library_books</mat-icon> -->
  </button>
  <button
    mat-icon-button
    class="nav-item"
    matTooltipClass="gnb-tooltip"
    matTooltipPosition="below"
    matTooltip="Settings"
    (click)="onOpenSettings()"
    [disabled]="!hasPermission(7)"
    >
    <!-- routerLinkActive="active"
    [routerLink]="['settings', {outlets: {sub: ['users']}}]" -->
    <mat-icon>settings</mat-icon>
  </button>
</div>

<div class="sub-navs">
  <ng-container [ngSwitch]="parentRoute">
    <ng-container *ngSwitchCase="'/monitor'">
      <a
        *ngIf="isAuthenticated"
        mat-button
        class="nav-item"
        routerLinkActive="active"
        routerLink="/monitor/status"
        >Status</a
      >
      <!-- <a
        mat-button
        class="nav-item"
        routerLinkActive="active"
        routerLink="/monitor/metrics"
        >Metrics</a
      > -->
    </ng-container>

    <ng-container *ngSwitchCase="'/controls'">
      <a
        mat-button
        class="nav-item"
        routerLinkActive="active"
        routerLink="/controls/vehicles"
        >Vehicles</a
      >
      <a
        mat-button
        class="nav-item"
        routerLinkActive="active"
        routerLink="/controls/server"
        >Server</a
      >
    </ng-container>
    <ng-container *ngSwitchCase="'/playback'">
      <a
        mat-button
        class="nav-item"
        routerLinkActive="active"
        routerLink="/playback"
        >Playback</a
      >
    </ng-container>
    <ng-container *ngSwitchCase="'/histories'">
      <a
        mat-button
        class="nav-item tight"
        routerLinkActive="active"
        routerLink="/histories/orders"
        >Orders</a
      >
      <a
        mat-button
        class="nav-item tight"
        routerLinkActive="active"
        routerLink="/histories/vehicles"
        >Vehicles</a
      >
      <a
        mat-button
        class="nav-item tight"
        routerLinkActive="active"
        routerLink="/histories/alarms"
        >Alarms</a
      >
      <a
        mat-button
        class="nav-item tight"
        routerLinkActive="active"
        routerLink="/histories/warnings"
        >Warnings</a
      >
    </ng-container>
    <ng-container *ngSwitchCase="'/logs'">
      <a
        mat-button
        class="nav-item"
        routerLinkActive="active"
        routerLink="/logs"
        >Logs</a
      >
    </ng-container>

    <div *ngSwitchDefault></div>
  </ng-container>
</div>
