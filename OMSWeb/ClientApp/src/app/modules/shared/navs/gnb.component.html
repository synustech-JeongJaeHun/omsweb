<mat-toolbar class="gnb-container">
  <div class="gnb-left">
    <div class="logo">
      <h1>OMS</h1>
      <div *ngIf="showVersion" class="version">{{ version }}</div>
    </div>
    <oms-gnb-menus class="menus" *ngIf="showGnb"></oms-gnb-menus>
  </div>
  <div class="gnb-center">
    <oms-gnb-states class="states"></oms-gnb-states>
  </div>
  <div class="gnb-right">
    <oms-gnb-indicators class="indicators"></oms-gnb-indicators>
    <oms-gnb-actions class="actions"></oms-gnb-actions>
  </div>
</mat-toolbar>
