<mat-form-field class="dense" appearance="outline">
  <input #inputValue matInput [formControl]="inputControl" [placeholder]="placeholder" />
</mat-form-field>

<mat-action-list>
  <button mat-list-item *ngFor="let item of targetOptions$ | async" (click)="onSelected(item)">
    #{{ item.id }}
  </button>
</mat-action-list>
