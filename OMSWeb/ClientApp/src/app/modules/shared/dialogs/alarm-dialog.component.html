<div class="dialog-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <oms-dialog-base [title]="'names.alarms' | translate">
    <ng-container class="dialog-layout">
      <div class="alert-list" cdkDragHandle>
        <dx-data-grid [dataSource]="dataSource" [height]="300" [width]="700" (onRowClick)="onClickRow($event)"
          [(selectedRowKeys)]="selectedIds">
          <dxo-selection mode="single"></dxo-selection>
          <dxo-scrolling mode="virtual"></dxo-scrolling>
          <dxo-header-filter [visible]="true"></dxo-header-filter>
          <dxi-column [allowFiltering]="false" [width]="110" dataType="datetime" dataField="time"
            [caption]="'names.time' | translate" format="yyyy/MM/dd HH:mm:ss">
          </dxi-column>
          <dxi-column [allowFiltering]="false" [width]="120" dataType="number" dataField="age"
            [caption]="'names.elapsedMin' | translate" cellTemplate="minuteCell">
            <div *dxTemplate="let d of 'minuteCell'">
              {{ (d.value / 60).toFixed(1) }}
            </div>
          </dxi-column>
          <dxi-column [allowFiltering]="true" [width]="110" dataType="string" dataField="vehicleId"
            [caption]="'names.vehicle' | translate"></dxi-column>
          <dxi-column [allowFiltering]="true" [width]="80" dataType="string" dataField="severity"
            [caption]="'names.severity' | translate">
            <dxo-lookup [dataSource]="severityLookup" displayExpr="name" valueExpr="value"></dxo-lookup>
          </dxi-column>
          <dxi-column [allowFiltering]="true" [width]="80" dataType="string" dataField="errorCode"
            [caption]="'names.code' | translate"></dxi-column>
          <dxi-column [allowFiltering]="false" dataType="string" dataField="description"
            [caption]="'names.desc' | translate"></dxi-column>
        </dx-data-grid>
      </div>

      <fieldset id="solutionContainer" *ngIf="currentItem">
        <legend>Vehicle #{{currentItem.vehicleId}} ({{currentItem.time | date: 'yyyy-MM-dd HH:mm:ss'}})</legend>

        <div class="grid-form">
          <mat-form-field class="dense" appearance="outline">
            <mat-label>{{'names.solution' | translate}}</mat-label>
            <textarea matInput readonly>{{currentItem.action}}</textarea>
          </mat-form-field>
          <mat-form-field class="dense" appearance="outline">
            <mat-label>{{'names.note' | translate}}</mat-label>
            <textarea matInput [placeholder]="'messages.alarmNoteHint'|translate" id="alaram_note"
              [(ngModel)]="alaram_note"></textarea>
          </mat-form-field>
          <button mat-raised-button color="primary" (click)="onModifySolution()">{{'names.modifySolution'|
            translate}}</button>
          <div class="primary-actions">
            <button mat-raised-button color="primary" (click)="onReset()">{{'names.resetVehicle'| translate}}</button>
            <button mat-raised-button (click)="onClear()">{{'names.clear'| translate}}</button>
          </div>
        </div>
      </fieldset>
    </ng-container>
  </oms-dialog-base>
  <!-- <div mat-dialog-content cdkDragHandle>
  </div> -->
</div>
