<div id="track-container" class="track-container">
  <oms-track-monitor id="track-canvas" [viewMode]="viewMode" [mapType]="trackData.mapType"
    [width]="omsTrackMonitorSize.width" [height]="omsTrackMonitorSize.height" [isClusterShowing]="true"
    [isGroupShowing]="true" (tooltipon)="onTooltipOn($event)" (tooltipoff)="onTooltipOff($event)"
    (focus)="onFocus($event)" (contextmenuon)="onContectMenuOn($event)" (backdrop)="onBackdrop($event)"
    (rotate)="onRotate($event)">
  </oms-track-monitor>
</div>
