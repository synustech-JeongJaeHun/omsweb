<div id="track-container" class="track-container">
  <oms-track-monitor id="track-canvas" [viewMode]="viewMode" [mapType]="trackData.mapType"
    [width]="viewerSetting.rect.width" [height]="viewerSetting.rect.height" [vehicleSize]="tmSetting.vehicleSize"
    [segmentDirectionSize]="tmSetting.segmentDirectionSize" [segmentWidth]="tmSetting.segmentWidth"
    [rotation]="tmSetting.rotation" [isMinimapVisible]="tmSetting.isMinimapVisible"
    [isVehicleLineVisible]="tmSetting.isVehicleLineVisible"
    [isSegmentDirectionVisible]="tmSetting.isSegmentDirectionVisible"
    [isPointLabelVisible]="tmSetting.isPointLabelVisible" [isStationVisible]="tmSetting.isStationVisible"
    [isBufferVisible]="tmSetting.isBufferVisible" [isGroupVisible]="tmSetting.isGroupVisible"
    [isClusterVisible]="tmSetting.isClusterVisible"
    [isOverlappingObjectsVisible]="tmSetting.isOverlappingObjectsVisible"
    [backgroundColor]="tmSetting.homeBackgroundColor" [stationColor]="tmSetting.stationColor"
    [bufferColor]="tmSetting.bufferColor" [pointColor]="tmSetting.pointColor"
    [normalSegmentColor]="tmSetting.normalSegmentColor" [disabledSegmentColor]="tmSetting.disabledSegmentColor"
    [segmentDirectionColor]="tmSetting.segmentDirectionColor" [autoModeVehicleColor]="tmSetting.autoModeVehicleColor"
    [manualModeVehicleColor]="tmSetting.manualModeVehicleColor" [noneModeVehicleColor]="tmSetting.noneModeVehicleColor"
    [cargoLoadingColor]="tmSetting.cargoLoadingColor" [cargoFullColor]="tmSetting.cargoFullColor"
    [cargoUnloadingColor]="tmSetting.cargoUnloadingColor" (tooltipon)="onTooltipOn($event)"
    (tooltipoff)="onTooltipOff($event)" (focus)="onFocus($event)" (contextmenuon)="onContectMenuOn($event)"
    (backdrop)="onBackdrop($event)">
  </oms-track-monitor>

  <div id="side_panel">
    <!-- detail panel at right side -->
    <oms-map-side-panel *ngIf="activeDetails" class="side_panel active" [selectedObject]="selectedObject">
    </oms-map-side-panel>
  </div>


  <!-- maptoolbar at left side -->
  <oms-map-toolbar id="map-toolbar" class="snb toolbar" [class.show-name]="showToolbarText"
    [buttonState]="preference.toggles" (centerZoom)="onCenterZoom()">
  </oms-map-toolbar>


</div>
