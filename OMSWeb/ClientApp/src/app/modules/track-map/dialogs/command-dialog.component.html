<oms-dialog-base [title]="'names.manualTransfer' | translate">
  <ng-container class="dialog-layout">
    <div mat-dialog-content>
      <mat-tab-group
        class="tab-group"
        [(selectedIndex)]="currentTab"
        animationDuration="0ms"
      >
        <mat-tab [label]="'names.command-move' | translate"></mat-tab>
        <mat-tab [label]="'names.command-fromTo' | translate"></mat-tab>
        <mat-tab [label]="'names.command-from' | translate"></mat-tab>
        <mat-tab [label]="'names.command-to' | translate"></mat-tab>
      </mat-tab-group>
      <div class="form">
        <div class="form-row">
          <dx-select-box
            [disabled]="
              isAuto === true && (currentTab === 1 || currentTab === 2)
            "
            [placeholder]="'names.selectVehicle' | translate"
            [dataSource]="vehicleList"
            [searchEnabled]="true"
            [(value)]="selectedVehicle"
          >
          </dx-select-box>
        </div>
        <div class="form-row">
          <dx-select-box
            [disabled]="currentTab !== 0"
            [placeholder]="'names.selectedPoint' | translate"
            [dataSource]="pointList"
            [(value)]="selectedPointId"
            [searchEnabled]="true"
          ></dx-select-box>
        </div>
        <div class="form-row">
          <dx-select-box
            [disabled]="currentTab === 3 || currentTab === 0"
            [(value)]="selectedFrom"
            [placeholder]="'names.selectedSource' | translate"
            [dataSource]="portList"
            [searchEnabled]="true"
          ></dx-select-box>
        </div>
        <div class="form-row">
          <dx-select-box
            [disabled]="currentTab === 2 || currentTab === 0"
            [(value)]="selectedTo"
            [placeholder]="'names.selectedDest' | translate"
            [dataSource]="portList"
            [searchEnabled]="true"
          ></dx-select-box>
        </div>
        <div class="form-row">
          <dx-text-box
            [disabled]="currentTab === 0"
            [placeholder]="'names.carrierId' | translate"
            [(value)]="carrierId"
          >
          </dx-text-box>
        </div>
      </div>
    </div>
    <div mat-dialog-actions>
      <button
        mat-raised-button
        [disabled]="!canApply"
        color="primary"
        (click)="onApply()"
      >
        {{ "names.apply" | translate }}
      </button>
      <button mat-raised-button mat-dialog-close>
        {{ "names.cancel" | translate }}
      </button>
    </div>
  </ng-container>
</oms-dialog-base>
