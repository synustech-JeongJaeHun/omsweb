<oms-dialog-base [title]="'names.search' | translate">
  <ng-container class="dialog-layout">
    <div mat-dialog-content>
      <dx-select-box
        #type
        class="form-item"
        [placeholder]="'messages.selectObjectType' | translate"
        [dataSource]="objectTypes"
        valueExpr="key"
        displayExpr="value"
        [searchEnabled]="true"
        (selectedItemChange)="onSelectType($event)"
      ></dx-select-box>
      <dx-autocomplete
        #value
        class="form-item"
        [placeholder]="'messages.searchId' | translate"
        [dataSource]="targets"
        [showClearButton]="true"
      ></dx-autocomplete>
      <!-- <dx-select-box
        #value
        class="form-item"
        placeholder="Select ID"
        [dataSource]="targets"
        [disabled]="!canSelectTarget"
        [searchEnabled]="true"
      ></dx-select-box> -->
    </div>
    <div mat-dialog-actions>
      <button
        mat-raised-button
        color="primary"
        (click)="onSearch(type.value, value.value)"
      >
        {{ "names.search" | translate }}
      </button>
      <button mat-raised-button mat-dialog-close>
        {{ "names.cancel" | translate }}
      </button>
    </div>
  </ng-container>
</oms-dialog-base>
