<div id="abnormal-tr-report-page">
  <div id="filter-area">
    <dx-date-box [placeholder]="'_START_DATE' | translate" type="datetime" [value]="start" [min]="start" [max]="end"
      [acceptCustomValue]="false" [showClearButton]="true" [displayFormat]="dateTimeFormat" #startDate>
    </dx-date-box>
    <div>~</div>
    <dx-date-box [placeholder]="'_END_DATE' | translate" type="datetime" [value]="now" [min]="start" [max]="end"
      [acceptCustomValue]="false" [showClearButton]="true" [displayFormat]="dateTimeFormat" #endDate>
    </dx-date-box>
    <button mat-raised-button color="primary" (click)="search(startDate.value, endDate.value)">
      {{ "names.search" | translate }}
    </button>
  </div>

  <div id="grid-container">
    <table class="table-summary">
      <tr>
        <td colspan="3">
          <table class="table-total-summary">
            <tr>
              <td rowspan="2">총 실패량</td>
              <td colspan="5">기간별 평균 실패량</td>
            </tr>
            <tr>
              <td>연간</td>
              <td>월별</td>
              <td>주간</td>
              <td>일별</td>
              <td>시간당</td>
            </tr>
            <tr>
              <td>63</td>
              <td>63</td>
              <td>15.75</td>
              <td>3.93</td>
              <td>1.01</td>
              <td>0.04</td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td colspan="3"></td>
      </tr>
      <tr>
        <td class="firstTD">기간별</td>
        <td class="secondTD">비클별</td>
        <td class="thirdTD"></td>
      </tr>
      <tr>
        <td rowspan="5" class="firstTD">
          <table class="table-summary-period">
            <tr>
              <td class="chart">
                <dx-chart id="chartAbnormalTRbyPeriod" palette="vintage" [dataSource]="abnormalTRbyPeriodData">
                  <dxi-series valueField="duplicate" name="DUPLICATE" color="#264478"></dxi-series>
                  <dxi-series valueField="mismatch" name="MISMATCH" color="#70AD47"></dxi-series>
                  <dxi-series valueField="readfail" name="READFAIL" color="#5B9BD5"></dxi-series>
                  <dxi-series valueField="dest" name="DEST" color="#FFC000"></dxi-series>
                  <dxi-series valueField="source" name="SOURCE" color="#A5A5A5"></dxi-series>
                  <dxi-series valueField="abort" name="ABORT" color="#ED7D31"></dxi-series>
                  <dxi-series valueField="cancel" name="CANCEL" color="#4472C4"></dxi-series>
                  <dxo-common-series-settings argumentField="period" type="stackedBar">
                  </dxo-common-series-settings>
                  <dxi-value-axis>
                    <dxo-grid [visible]="false"></dxo-grid>
                  </dxi-value-axis>
                  <!--
                  <dxi-value-axis name="Average Of Transfer" position="right">
                    <dxo-grid [visible]="true"></dxo-grid>-->
                  <!--
                    <dxo-title text="Average of Transfer"></dxo-title>
                    -->
                  <!--
                  </dxi-value-axis>
                  -->
                  <dxo-legend [visible]="true" verticalAlignment="top" horizontalAlignment="right"></dxo-legend>
                  <dxo-export [enabled]="false"></dxo-export>
                  <dxo-tooltip [enabled]="true" [shared]="true" [customizeTooltip]="customizeTooltip">
                    <dxo-format type="largeNumber" [precision]="1"></dxo-format>
                  </dxo-tooltip>
                </dx-chart>
              </td>
            </tr>
            <tr>
              <td>
                <div></div>
              </td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td>
                <div id="grid-container-abnormalTRbyPeriod">
                  <dx-data-grid [dataSource]="abnormalTRbyPeriodData" [columnAutoWidth]="true" [remoteOperations]="true"
                    [height]="gridHeightByPeriod" [width]="gridWidthByPeriod" [showBorders]="true"
                    [hoverStateEnabled]="true">
                    <dxo-scrolling mode="standard" rowRenderingMode="standard" showScrollbar="always">
                    </dxo-scrolling>
                    <dxo-header-filter [visible]="true"></dxo-header-filter>
                    <dxo-filter-row [visible]="false"></dxo-filter-row>
                    <dxi-column dataType="string" dataField="period" caption="기간별" [customizeText]="transformPeriod"
                      alignment="center">
                    </dxi-column>
                    <dxi-column dataType="string" dataField="total" caption="실패량" alignment="center">
                    </dxi-column>
                  </dx-data-grid>
                </div>
              </td>
            </tr>
          </table>
        </td>
        <td class="secondTD">
          <dx-chart id="chartAbnormalTRbyVehicle" palette="vintage" [dataSource]="abnormalTRbyVehicleData">
            <dxi-series valueField="duplicate" name="DUPLICATE" color="#264478"></dxi-series>
            <dxi-series valueField="mismatch" name="MISMATCH" color="#70AD47"></dxi-series>
            <dxi-series valueField="readfail" name="READFAIL" color="#5B9BD5"></dxi-series>
            <dxi-series valueField="dest" name="DEST" color="#FFC000"></dxi-series>
            <dxi-series valueField="source" name="SOURCE" color="#A5A5A5"></dxi-series>
            <dxi-series valueField="abort" name="ABORT" color="#ED7D31"></dxi-series>
            <dxi-series valueField="cancel" name="CANCEL" color="#4472C4"></dxi-series>
            <!--
            <dxo-common-series-settings argumentField="vehicleId" type="stackedBar">
            </dxo-common-series-settings>
            -->
            <dxo-common-series-settings argumentField="vehicleName" type="stackedBar">
            </dxo-common-series-settings>
            <dxi-value-axis>
              <dxo-grid [visible]="false"></dxo-grid>
            </dxi-value-axis>
            <!--
            <dxi-value-axis name="Average Of Transfer" position="right">
              <dxo-grid [visible]="true"></dxo-grid>-->
            <!--
                <dxo-title text="Average of Transfer"></dxo-title>
                -->
            <!--
            </dxi-value-axis>
            -->
            <dxo-legend [visible]="true" verticalAlignment="top" horizontalAlignment="right"></dxo-legend>
            <dxo-export [enabled]="false"></dxo-export>
            <dxo-tooltip [enabled]="true" [shared]="true" [customizeTooltip]="customizeTooltip">
              <dxo-format type="largeNumber" [precision]="1"></dxo-format>
            </dxo-tooltip>
          </dx-chart>
        </td>
        <td class="thirdTD">
          <div id="grid-container-abnormalTRbyVehicle">
            <dx-data-grid [dataSource]="abnormalTRbyVehicleData" [columnAutoWidth]="true" [remoteOperations]="true"
              [height]="gridHeightByVehicle" [width]="gridWidthByVehicle" [showBorders]="true"
              [hoverStateEnabled]="true">
              <dxo-scrolling mode="standard" rowRenderingMode="standard" showScrollbar="always">
              </dxo-scrolling>
              <dxo-header-filter [visible]="true"></dxo-header-filter>
              <dxo-filter-row [visible]="false"></dxo-filter-row>
              <dxi-column dataType="string" dataField="vehicleName" caption="비클별" alignment="center">
              </dxi-column>
              <dxi-column dataType="string" dataField="total" caption="실패량" alignment="center">
              </dxi-column>
            </dx-data-grid>
          </div>
        </td>
      </tr>
      <tr>
        <td class="secondTD">SOURCE 별</td>
        <td class="thirdTD"></td>
      </tr>
      <tr>
        <td class="secondTD">
          <dx-chart id="chartAbnormalTRbySource" palette="vintage" [dataSource]="abnormalTRbySourceData">
            <dxi-series valueField="duplicate" name="DUPLICATE" color="#264478"></dxi-series>
            <dxi-series valueField="mismatch" name="MISMATCH" color="#70AD47"></dxi-series>
            <dxi-series valueField="readfail" name="READFAIL" color="#5B9BD5"></dxi-series>
            <dxi-series valueField="dest" name="DEST" color="#FFC000"></dxi-series>
            <dxi-series valueField="source" name="SOURCE" color="#A5A5A5"></dxi-series>
            <dxi-series valueField="abort" name="ABORT" color="#ED7D31"></dxi-series>
            <dxi-series valueField="cancel" name="CANCEL" color="#4472C4"></dxi-series>
            <!--
            <dxo-common-series-settings argumentField="SourceId" type="stackedBar">
            </dxo-common-series-settings>
            -->
            <dxo-common-series-settings argumentField="SourceName" type="stackedBar">
            </dxo-common-series-settings>
            <dxi-value-axis>
              <dxo-grid [visible]="false"></dxo-grid>
            </dxi-value-axis>
            <!--
            <dxi-value-axis name="Average Of Transfer" position="right">
              <dxo-grid [visible]="true"></dxo-grid>-->
            <!--
                <dxo-title text="Average of Transfer"></dxo-title>
                -->
            <!--
            </dxi-value-axis>
            -->
            <dxo-legend [visible]="true" verticalAlignment="top" horizontalAlignment="right"></dxo-legend>
            <dxo-export [enabled]="false"></dxo-export>
            <dxo-tooltip [enabled]="true" [shared]="true" [customizeTooltip]="customizeTooltip">
              <dxo-format type="largeNumber" [precision]="1"></dxo-format>
            </dxo-tooltip>
          </dx-chart>
        </td>
        <td class="thirdTD">
          <div id="grid-container-abnormalTRbySource">
            <dx-data-grid [dataSource]="abnormalTRbySourceData" [columnAutoWidth]="true" [remoteOperations]="true"
              [height]="gridHeightBySource" [width]="gridWidthBySource" [showBorders]="true" [hoverStateEnabled]="true">
              <dxo-scrolling mode="standard" rowRenderingMode="standard" showScrollbar="always">
              </dxo-scrolling>
              <dxo-header-filter [visible]="true"></dxo-header-filter>
              <dxo-filter-row [visible]="false"></dxo-filter-row>
              <dxi-column dataType="string" dataField="SourceName" caption="SOURCE 별" alignment="center">
              </dxi-column>
              <dxi-column dataType="string" dataField="total" caption="실패량" alignment="center">
              </dxi-column>
            </dx-data-grid>
          </div>
        </td>
      </tr>
      <tr>
        <td class="secondTD">DEST 별</td>
        <td class="thirdTD"></td>
      </tr>
      <tr>
        <td class="secondTD">
          <dx-chart id="chartAbnormalTRbyDest" palette="vintage" [dataSource]="abnormalTRbyDestData">
            <dxi-series valueField="duplicate" name="DUPLICATE" color="#264478"></dxi-series>
            <dxi-series valueField="mismatch" name="MISMATCH" color="#70AD47"></dxi-series>
            <dxi-series valueField="readfail" name="READFAIL" color="#5B9BD5"></dxi-series>
            <dxi-series valueField="dest" name="DEST" color="#FFC000"></dxi-series>
            <dxi-series valueField="source" name="SOURCE" color="#A5A5A5"></dxi-series>
            <dxi-series valueField="abort" name="ABORT" color="#ED7D31"></dxi-series>
            <dxi-series valueField="cancel" name="CANCEL" color="#4472C4"></dxi-series>
            <!--
            <dxo-common-series-settings argumentField="DestinationId" type="stackedBar">
            </dxo-common-series-settings>
            -->
            <dxo-common-series-settings argumentField="DestinationName" type="stackedBar">
            </dxo-common-series-settings>
            <dxi-value-axis>
              <dxo-grid [visible]="false"></dxo-grid>
            </dxi-value-axis>
            <!--
            <dxi-value-axis name="Average Of Transfer" position="right">
              <dxo-grid [visible]="true"></dxo-grid>-->
            <!--
                <dxo-title text="Average of Transfer"></dxo-title>
                -->
            <!--
            </dxi-value-axis>
            -->
            <dxo-legend [visible]="true" verticalAlignment="top" horizontalAlignment="right"></dxo-legend>
            <dxo-export [enabled]="false"></dxo-export>
            <dxo-tooltip [enabled]="true" [shared]="true" [customizeTooltip]="customizeTooltip">
              <dxo-format type="largeNumber" [precision]="1"></dxo-format>
            </dxo-tooltip>
          </dx-chart>
        </td>
        <td class="thirdTD">
          <div id="grid-container-abnormalTRbyDest">
            <dx-data-grid [dataSource]="abnormalTRbyDestData" [columnAutoWidth]="true" [remoteOperations]="true"
              [height]="gridHeightByDest" [width]="gridWidthByDest" [showBorders]="true" [hoverStateEnabled]="true">
              <dxo-scrolling mode="standard" rowRenderingMode="standard" showScrollbar="always">
              </dxo-scrolling>
              <dxo-header-filter [visible]="true"></dxo-header-filter>
              <dxo-filter-row [visible]="false"></dxo-filter-row>
              <dxi-column dataType="string" dataField="DestinationName" caption="DEST 별" alignment="center">
              </dxi-column>
              <dxi-column dataType="string" dataField="total" caption="실패량" alignment="center">
              </dxi-column>
            </dx-data-grid>
          </div>
        </td>
      </tr>
    </table>
  </div>
</div>
