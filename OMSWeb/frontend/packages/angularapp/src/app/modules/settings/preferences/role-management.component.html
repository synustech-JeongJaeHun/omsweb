<h3>{{ "names.rolesSetting" | translate }}</h3>

<div class="sub-links">
  <button mat-flat-button [routerLink]="['../users']">
    {{ "names.userManagement" | translate }}
  </button>
</div>
<div class="role-panel">
  <h5>{{ "names.roles" | translate }}</h5>
  <h5>{{ "names.permissions" | translate }}</h5>

  <mat-nav-list class="dense role-list">
    <a mat-list-item *ngFor="let item of roles" [class.active]="selectedRole?.id === item.id"
      (click)="onSelectRole(item)">
      {{ item.name }}
    </a>
  </mat-nav-list>
  <mat-selection-list class="dense permission-list">
    <mat-list-option checkboxPosition="before" color="primary" [selected]="hasPermission(item)"
      *ngFor="let item of permissions">
      {{ "enums.permissions." + item.name | translate }}
    </mat-list-option>
  </mat-selection-list>

  <div class="full-span-col"></div>
</div>
