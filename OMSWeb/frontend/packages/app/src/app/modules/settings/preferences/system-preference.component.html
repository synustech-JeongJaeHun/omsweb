<div class="setting-header">
	<h3 class="setting-title">{{ 'names.systemPreference' | translate }}</h3>
	<div class="setting-actions"></div>
</div>

<div class="setting-container">
	<fieldset>
		<legend>
			{{ 'names.rebalance' | translate }} {{ 'names.mode' | translate }}
		</legend>
		<label>
			{{ 'names.rebalance' | translate }} {{ 'names.mode' | translate }}{{ ': ' }}
			<span style="color: blue">{{ translatedSelectedRebalancedMode }}</span>
			<dx-button-group [items]="rebalanceModes"
											 keyExpr="key"
											 tabIndex="tabIndex"
											 focusStateEnabled="true"
											 [selectedItemKeys]="selectedRebalanceMode"
											 (onItemClick)="setRebalanceMode($event.itemData.key)"
											 buttonTemplate="buttonTemplate"
											 style="margin-left: 2em; height: 30px">
				<span *dxTemplate="let buttonData of 'buttonTemplate'">
					{{buttonData.label}}
				</span>
			</dx-button-group>
		</label>
	</fieldset>
	<fieldset class="chain-button">
		<legend>
			{{ 'names.chainManualCommandDisabled' | translate }}
		</legend>
		<label>
			{{ 'names.state' | translate }}{{ ': ' }}
			<ng-container *ngIf="isChainManualCommandDisabled === true">
				{{ 'names.on' | translate }}
				<button style="margin-left: 15px"
								mat-raised-button
								class="dense"
								[disabled]="!hasPermissions([permissionEnums.HostOrderEnable])"
								color="primary"
								(click)="setChainManualCommandDisabled()">
					{{ 'names.disable' | translate }}
				</button>
			</ng-container>
			<ng-container *ngIf="isChainManualCommandDisabled === false">
				{{ 'names.off' | translate }}
				<button style="margin-left: 15px"
								mat-raised-button
								class="dense"
								[disabled]="!hasPermissions([permissionEnums.HostOrderEnable])"
								color="primary"
								(click)="setChainManualCommandDisabled()">
					{{ 'names.enable' | translate }}
				</button>
			</ng-container>
		</label>
	</fieldset>
	<fieldset class="set-delay-timeout-button">
		<legend>
			{{ 'names.setDelayedTransferTimeout' | translate }}
		</legend>
		<div class="field-row">
			<label>{{ 'names.time' | translate }} {{ '(sec): ' }}</label>
			<mat-form-field class="dense" appearance="outline">
				<input matInput #delayedTranferTimeoutId type="number" [value]="delayedTranferTimeoutValue" min="0" max="2147483"
								(change)="onChangeDelayedTransferTimeout(delayedTranferTimeoutId.value)" />
			</mat-form-field>
			<ng-container>
				<input type="checkbox" #warningNotifyId color="primary" value="0" [(ngModel)]="warningNotifyValue" />
				<label for="warningNotifyId">{{ "names.warningNotify" | translate }}</label>
			</ng-container>
			<ng-container>
				<input type="checkbox" #tableNotifyId color="primary" value="0" [(ngModel)]="tableNotifyValue" />
				<label for="tableNotifyId">{{ "names.tableNotify" | translate }}</label>
			</ng-container>
			<button style="margin-left: 15px" mat-raised-button class="dense" [disabled]="!hasPermissions([permissionEnums.HostOrderEnable])" color="primary"
							(click)="setDelayedTransferTimeout()">
				{{ 'names.apply' | translate }}
			</button>
		</div>
	</fieldset>
