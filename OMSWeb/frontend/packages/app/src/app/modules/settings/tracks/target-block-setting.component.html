<div class="setting-header">
  <h4 class="setting-title">{{ 'names.targetblock' | translate }}</h4>
  <div class="setting-actions">
    <button mat-raised-button class="dense" color="primary" [disabled]="!isUpdated" (click)="onSave()">
      {{ 'names.save' | translate }}
    </button>
  </div>
</div>

<div class="main-container">

  <div class="single-grid">
    <h4 clss="setting-title">Vehicle</h4>
    <dx-data-grid
                  [dataSource]="vehicles"
                  [focusedRowKey]="focusedVehicle"
                  [selectedRowKeys]="selectedVehicle"
                  [showBorders]="true"
                  [keyExpr]="'logicalId'"
                  [focusedRowEnabled]="true"
                  (onContentReady)="setInitialSelection()"
                  (onFocusedRowChanged)="onFocusedVehicleRowChanged($event)"
                  height="350px"
                  width="13em">
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-selection mode="single"
                     showCheckBoxesMode="always"></dxo-selection>
      <dxi-column [width]="20" datyType="string" dataField="logicalId" [caption]="'names.vehicle' | translate"> </dxi-column>
    </dx-data-grid>
  </div>
  <div class="grid-divider"></div>
  <div class="single-grid ">
    <h4 clss="setting-title">Station/Buffer</h4>
    <div class="two-grid">

      <dx-data-grid #targetAllowDataGrid
                    [dataSource]="targetAllowDataSource"
                    [showBorders]="true"
                    [keyExpr]="'targetBlockOnlineName'"
                    [(selectedRowKeys)]="selectedTargetAllow"
                    height="350px"
                    width="14em">
        <dxo-scrolling mode="virtual"></dxo-scrolling>
        <dxo-selection mode="multiple"
                       showCheckBoxesMode="always"></dxo-selection> 
        <dxi-column [width]="40" datyType="string" dataField="targetBlockOnlineName" [caption]="'names.returnable' | translate"> </dxi-column>
        <!--<dxi-column [width]="120" datyType="string" dataField="logicalId" [caption]="'names.logicalId' | translate"> </dxi-column>-->
      </dx-data-grid>

      <div class="actions">
        <button mat-icon-button
                (click)="addToTargetBlockings()">
          <mat-icon>arrow_right</mat-icon>
        </button>
        <button mat-icon-button
                (click)="removeFromTargetBlockings()">
          <mat-icon>arrow_left</mat-icon>
        </button>
      </div>

      <dx-data-grid id="targetBlockDataGrid"
                    [dataSource]="targetBlockDataSource"
                    [showBorders]="true"
                    [keyExpr]="'targetBlockOnlineName'"
                    [(selectedRowKeys)]="selectedTargetBlock"
                    height="350px"
                    width="14em">
        <dxo-scrolling mode="virtual"></dxo-scrolling>
        <dxo-selection mode="multiple"
                       showCheckBoxesMode="always"></dxo-selection>
        <dxi-column [width]="40" datyType="string" dataField="targetBlockOnlineName" [caption]="'names.nonReturnable' | translate"> </dxi-column>
        <!--<dxi-column [width]="120" datyType="string" dataField="logicalId" [caption]="'names.logicalId' | translate"> </dxi-column>-->
      </dx-data-grid>

    </div>
  </div>
</div>
