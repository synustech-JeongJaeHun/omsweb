<div class="setting-header">
  <h4 class="setting-title">{{ 'names.targetblock' | translate }}</h4>
  <div class="setting-actions">
    <button mat-raised-button class="dense" color="primary"  (click)="onSave()">
      {{ 'names.save' | translate }}
    </button>
  </div>
</div>

<div class="main-container">

  <div class="single-grid">
    <h4 clss="setting-title">Vehicle</h4>
    <dx-data-grid [disabled]="!isModeStk"
                  [dataSource]="candidateStks"
                  [showBorders]="true"
                  [keyExpr]="'id'"
                  [(selectedRowKeys)]="selectedCandidateStks"
                  height="350px"
                  width="13em">
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-selection mode="multiple"
                     showCheckBoxesMode="always"></dxo-selection>
      <dxi-column [width]="20" datyType="string" dataField="id" [caption]="'Vehicle' | translate"> </dxi-column>
    </dx-data-grid>
  </div>
  <div class="grid-divider"></div>
  <div class="single-grid ">
    <h4 clss="setting-title">Station/Buffer</h4>
    <div class="two-grid">
      <dx-data-grid [disabled]="!isModeStk"
                    [dataSource]="candidateStks"
                    [showBorders]="true"
                    [keyExpr]="'id'"
                    [(selectedRowKeys)]="selectedCandidateStks"
                    height="350px"
                    width="13em">
        <dxo-scrolling mode="virtual"></dxo-scrolling>
        <dxo-selection mode="multiple"
                       showCheckBoxesMode="always"></dxo-selection>
        <dxi-column [width]="40" datyType="string" dataField="id" [caption]="'반송 가능' | translate"> </dxi-column>
      </dx-data-grid>

      <div class="actions">
        <button mat-icon-button>
          <mat-icon>arrow_right</mat-icon>
        </button>
        <button mat-icon-button>
          <mat-icon>arrow_left</mat-icon>
        </button>
        <!--<span style="color: rgba(0, 0, 0, .87);">
          제거
        </span>-->
      </div>

      <dx-data-grid [disabled]="!isModeStk"
                    [dataSource]="chosenStks"
                    [showBorders]="true"
                    [keyExpr]="'id'"
                    height="350px"
                    width="13em">
        <dxo-scrolling mode="virtual"></dxo-scrolling>
        <dxo-selection mode="multiple"
                       showCheckBoxesMode="always"></dxo-selection>
        <dxi-column [width]="40" datyType="string" dataField="id" [caption]="'반송 불가' | translate"> </dxi-column>
        <!--<dxi-column [width]="120" datyType="string" dataField="logicalId" [caption]="'names.logicalId' | translate"> </dxi-column>-->
      </dx-data-grid>

    </div>
  </div>
</div>
