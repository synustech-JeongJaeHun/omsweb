<oms-dialog-base [title]="'names.search' | translate">
  <ng-container class="dialog-layout">
    <div mat-dialog-content>
      <dx-select-box #type class="form-item"
        [dataSource]="objectTypes" valueExpr="key" displayExpr="value"
        [value]="selectedType.key" [searchEnabled]="true"
        (selectedItemChange)="onSelectType($event)"></dx-select-box>
      <dx-autocomplete #value class="form-item" [placeholder]="'messages.searchId' | translate" [dataSource]="targets"
        [showClearButton]="true" [disabled]="!type.value" [maxItemCount]="50"
                       valueExpr="logicalId" searchExpr="logicalId">
      </dx-autocomplete>
    </div>

    <div mat-dialog-actions>
      <button mat-raised-button color="primary" [disabled]="!canSelectTarget(type.value, value.value)"
        (click)="onSearch(type.value, value.value)">
        {{ "names.search" | translate }}
      </button>
      <button mat-raised-button mat-dialog-close>
        {{ "names.cancel" | translate }}
      </button>
    </div>
  </ng-container>
</oms-dialog-base>
