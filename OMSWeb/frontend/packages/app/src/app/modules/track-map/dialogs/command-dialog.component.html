<oms-dialog-base [title]="'names.manualTransfer' | translate">
	<ng-container class="dialog-layout">
		<ng-container [ngSwitch]="currentTab">
			<ng-container *ngSwitchCase="0">
				<ng-container *ngTemplateOutlet="fromtoForm"></ng-container>
			</ng-container>
			<ng-container *ngSwitchCase="1">
				<ng-container *ngTemplateOutlet="fromForm"></ng-container>
			</ng-container>
			<ng-container *ngSwitchCase="2">
				<ng-container *ngTemplateOutlet="toForm"></ng-container>
			</ng-container>
			<ng-container *ngSwitchCase="3">
				<ng-container *ngTemplateOutlet="moveForm"></ng-container>
			</ng-container>
      <ng-container *ngSwitchCase="4">
        <ng-container *ngTemplateOutlet="scanForm"></ng-container>
      </ng-container>
			<ng-container *ngSwitchCase="5">
				<ng-container *ngTemplateOutlet="mtlForm"></ng-container>
			</ng-container>
			<ng-container *ngSwitchDefault> </ng-container>
		</ng-container>
	</ng-container>
</oms-dialog-base>

<ng-template #fromtoForm>
	<div mat-dialog-content>
		<mat-tab-group
			class="tab-group"
      [ngClass]="'mat-tab-group-'+tabs.length"
			[(selectedIndex)]="currentTab"
			(selectedIndexChange)="onTabChanged()"
			animationDuration="0ms"
		>
			<mat-tab
				*ngFor="let tab of tabs"
				[label]="'names.command-' + tab | translate"
			></mat-tab>
		</mat-tab-group>
		<div class="form">
			<div class="form-row">
				<oms-unit-selector
					[findScopes]="['vehicles']"
					[disabled]="commandState.vehicleDisabled"
					[selectedUnit]="commandState.vehicle"
					(selectedUnitChange)="onChangeVehicle($event)"
					[placeholder]="'names.selectVehicle' | translate"
				>
				</oms-unit-selector>
			</div>
			<div class="form-row">
				<oms-unit-selector
					[findScopes]="['stations', 'buffers']"
					[filterWords]="sourceFilterWords"
					[disabled]="commandState.sourceDisabled"
					[selectedUnit]="commandState.source"
					(selectedUnitChange)="onChangeSource($event)"
					[placeholder]="'names.selectSource' | translate"
				></oms-unit-selector>
			</div>
			<div class="form-row">
				<oms-unit-selector
					[findScopes]="['stations', 'buffers']"
					[filterWords]="destinationFilterWords"
					[disabled]="commandState.destDisabled"
					[selectedUnit]="commandState.dest"
					(selectedUnitChange)="onChangeDest($event)"
					[placeholder]="'names.selectDest' | translate"
				></oms-unit-selector>
			</div>
			<div class="form-row">
				<mat-form-field class="dense" appearance="outline">
					<input
						matInput
						name="carrier"
						[disabled]="commandState.carrierDisabled"
						[value]="commandState.carrier ? commandState.carrier : ''"
						(input)="onChangeCarrier($event.target.value)"
						[placeholder]="'names.carrier' | translate"
					/>
				</mat-form-field>
			</div>
			<div class="form-row">
				<mat-form-field class="dense" appearance="outline">
					<input
						matInput
						name="priority"
						[placeholder]="'names.priority' | translate"
						[(ngModel)]="commandState.priority"
						type="text"
						pattern="[1-9]*"
						maxlength="2"
					/>
				</mat-form-field>
			</div>
			<div class="form-row">
				<mat-slide-toggle
					[(ngModel)]="commandState.selectVehicle"
					color="primary"
					>{{ 'names.selectVehicle' | translate }}</mat-slide-toggle
				>
			</div>
		</div>
	</div>
	<div mat-dialog-actions>
		<button
			mat-raised-button
			[disabled]="!canApply"
			color="primary"
			(click)="onApply()"
		>
			{{ 'names.apply' | translate }}
		</button>
		<button mat-raised-button mat-dialog-close>
			{{ 'names.cancel' | translate }}
		</button>
	</div>
</ng-template>

		</mat-tab-group>

			<div class="form-row">
				<oms-unit-selector
					[findScopes]="['vehicles']"
					[disabled]="commandState.vehicleDisabled"
					[selectedUnit]="commandState.vehicle"
					(selectedUnitChange)="onChangeVehicle($event)"
					[placeholder]="'names.selectVehicle' | translate"
				>
				</oms-unit-selector>
			</div>
			<div class="form-row">
				<oms-unit-selector
					[findScopes]="['mtls']"
					[selectedUnit]="commandState.mtl"
					(selectedUnitChange)="onChangeMtl($event)"
					[placeholder]="'names.selectMTL' | translate"
				></oms-unit-selector>
			</div>
			<div class="form-row">
				<mat-radio-group [(ngModel)]="commandState.mtlInOut" color="primary">
					<mat-radio-button [value]="true" style="margin-left: 10px" [disabled]="commandState.mtlInDisabled"
						>In [Line → MTL]</mat-radio-button
					>
					<mat-radio-button [value]="false" style="margin-left: 160px" [disabled]="commandState.mtlOutDisabled"
						>Out [MTL→Line]</mat-radio-button
					>
				</mat-radio-group>
			</div>
		</div>
	</div>
	<div mat-dialog-actions>
		<button

			{{ 'names.cancel' | translate }}
		</button>
	</div>

<ng-template #scanForm>
  <div mat-dialog-content>
    <mat-tab-group
      class="tab-group"
      [(selectedIndex)]="currentTab"
      (selectedIndexChange)="onTabChanged()"
      animationDuration="0ms"
    >
      <mat-tab
        *ngFor="let tab of tabs"
        [label]="'names.command-' + tab | translate"
      ></mat-tab>
    </mat-tab-group>
    <div class="form">
      <div class="form-row">
        <oms-unit-selector
          [findScopes]="['vehicles']"
          [disabled]="commandState.vehicleDisabled"
          [selectedUnit]="commandState.vehicle"
          (selectedUnitChange)="onChangeVehicle($event)"
          [placeholder]="'names.selectVehicle' | translate"
        >
        </oms-unit-selector>
      </div>
      <div class="form-row">
        <oms-unit-selector
          [findScopes]="['buffers']"
          [filterWords]="sourceFilterWords"
          [disabled]="commandState.sourceDisabled"
          [selectedUnit]="commandState.source"
          (selectedUnitChange)="onChangeBuffer($event)"
          [placeholder]="'names.searchBuffer' | translate"
        ></oms-unit-selector>
      </div>
      <div class="form-row table-div">
        <table *ngIf="this.commandState?.buffers.length===0" style="color: gray; height: 100%">
          <div class="empty-div">
            {{'names.empty' | translate}}
          </div>
        </table>
        <table *ngIf="this.commandState?.buffers.length>0">
          <tr>
            <td>no.</td>
            <td>Logical Id</td>
            <td>Physical Id</td>
            <td></td>
          </tr>
          <tr *ngFor="let buffer of this.commandState?.buffers; let i=index">
            <td>{{i+1}}</td>
            <td>{{buffer.logicalId}}</td>
            <td>{{buffer.physicalId}}</td>
            <td style="text-align: right">
              <mat-icon (click)="bufferSplice(i)">close</mat-icon>
            </td>
          </tr>
        </table>
      </div>

      <div class="form-row" style="display: flex">
        <mat-label class="mat-slide-toggle">{{'names.selectVehicle' | translate}}</mat-label>
        <mat-slide-toggle (ngModelChange)="changeVHLFlag()"
                          [(ngModel)]="commandState.vehicleFlag"
                          color="primary"
        >{{'names.multiVehicle' | translate}}</mat-slide-toggle
        >
      </div>
    </div>
  </div>
  <div mat-dialog-actions>
    <button
      mat-raised-button
      [disabled]="!canApply"
      color="primary"
      (click)="onApply()"
    >
      {{ 'names.apply' | translate }}
    </button>
    <button mat-raised-button mat-dialog-close>
      {{ 'names.cancel' | translate }}
    </button>
  </div>
</ng-template>
