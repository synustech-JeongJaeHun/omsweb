<mat-list [class.show-name]="showToolName" mdePopoverTarget #popoverTarget="mdePopoverTarget">
  <button matListItem mat-button class="tool-item" [matTooltipDisabled]="showToolName" matTooltipClass="snb-tooltip"
    matTooltipPosition="right" [matTooltip]="'names.playback' | translate" (click)="onPlaybackDialog()">
    <mat-icon>play_circle_outline</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.centerZoom" | translate
      }}</span>
  </button>

  <mat-divider></mat-divider>

  <button matListItem mat-button class="tool-item" [matTooltipDisabled]="showToolName" matTooltipClass="snb-tooltip"
    matTooltipPosition="right" [matTooltip]="'names.centerZoom' | translate" (click)="centerZoom.emit()">
    <mat-icon>center_focus_strong</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.centerZoom" | translate
      }}</span>
  </button>

  <mat-divider></mat-divider>

  <button #btnSearch matListItem mat-button class="tool-item" [matTooltipDisabled]="showToolName"
    matTooltipClass="snb-tooltip" matTooltipPosition="right" [matTooltip]="'names.search' | translate"
    (click)="onSearch()">
    <mat-icon>search</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.search" | translate
      }}</span>
  </button>
  <button #btnTrack matListItem mat-button class="tool-item" [class.active]="isTracking"
    [matTooltipDisabled]="showToolName" matTooltipClass="snb-tooltip" matTooltipPosition="right"
    [matTooltip]="'names.trackVehicle' | translate" (click)="onTrackVehicle()">
    <mat-icon>location_on</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.trackVehicle" | translate
      }}</span>
  </button>
  <button #btnShowObj matListItem mat-button class="tool-item" [matTooltipDisabled]="showToolName"
    matTooltipClass="snb-tooltip" matTooltipPosition="right" [matTooltip]="'names.showObjects' | translate"
    (click)="onTuneVisibility()">
    <mat-icon>visibility</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.showObjects" | translate
      }}</span>
  </button>
  <button matListItem mat-button class="tool-item"
    [class.active]="trackMonitorSettingService.trackSetting.isMinimapVisible" (click)="trackMonitorSettingService.update({
    group: 'Visibility',
    key: 'isMinimapVisible',
    value: !trackMonitorSettingService.trackSetting.isMinimapVisible
  })" [matTooltipDisabled]="showToolName" matTooltipClass="snb-tooltip" matTooltipPosition="right"
    [matTooltip]="'names.showMinimap' | translate">
    <mat-icon>map</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.showMinimap" | translate
      }}</span>
  </button>

  <mat-divider></mat-divider>

  <button matListItem mat-button class="tool-item" [class.active]="buttonState.controlTable"
    [matTooltipDisabled]="showToolName" matTooltipClass="snb-tooltip" matTooltipPosition="right"
    [matTooltip]="'names.showControlTable' | translate" (click)="onToggleTool('controlTable')">
    <mat-icon>window</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.showControlTable" | translate
      }}</span>
  </button>

  <button *ngIf="hasPermission(permissionEnums.ViewItemDetails)" matListItem mat-button class="tool-item"
    [class.active]="buttonState.itemDetails" [matTooltipDisabled]="showToolName" matTooltipClass="snb-tooltip"
    matTooltipPosition="right" [matTooltip]="'names.itemDetails' | translate" (click)="onToggleTool('itemDetails')">
    <mat-icon fontSet="material-icons-outlined">info</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.itemDetails" | translate
      }}</span>
  </button>
  <mat-divider></mat-divider>
  <!-- <button *ngIf="bufferEnabled && hasPermission(permissionEnums.ViewBuffer)" #btnShowObj matListItem mat-button class="tool-item"
    [matTooltipDisabled]="showToolName" matTooltipClass="snb-tooltip" matTooltipPosition="right"
    [matTooltip]="'names.buffer' | translate" (click)="onOpenBufferStatus()">
    <mat-icon>sensor_window</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.buffer" | translate
      }}</span>
  </button> -->

  <button *ngIf="hasPermission(permissionEnums.ViewVehicleStatus)" #btnShowObj matListItem mat-button class="tool-item"
    [matTooltipDisabled]="showToolName" matTooltipClass="snb-tooltip" matTooltipPosition="right"
    [matTooltip]="'names.vehicleStatus' | translate" (click)="onOpenVehicleStatus()">
    <mat-icon>security_update_warning</mat-icon>
    <span class="tool-name" *ngIf="showToolName">{{
      "names.vehicleStatus" | translate
      }}</span>
  </button>
</mat-list>

<mde-popover #visibilityPopover="mdePopover" [mdePopoverOverlapTrigger]="false" mdePopoverArrowWidth="0"
  [mdePopoverCloseOnClick]="false" [mdeFocusTrapEnabled]="false" [mdePopoverLeaveDelay]="300">
  <mat-list class="popover-list mat-elevation-z2">
    <div class="popover-title mat-elevation-z2">
      {{ "names.showObjects" | translate }}
    </div>
    <button matListItem mat-button [class.active]="buttonState.vehicleLines" (click)="onToggleTool('vehicleLines')">
      {{ "names.showVehicleLines" | translate }}
    </button>
    <button matListItem mat-button [class.active]="buttonState.expectedPaths" (click)="onToggleTool('expectedPaths')">
      {{ "names.showExpectedPaths" | translate }}
    </button>
    <button matListItem mat-button [class.active]="buttonState.pointLabels" (click)="onToggleTool('pointLabels')">
      {{ "names.showPointLabels" | translate }}
    </button>
    <button matListItem mat-button [class.active]="buttonState.segmentDirections"
      (click)="onToggleTool('segmentDirections')">
      {{ "names.showSegmentDirections" | translate }}
    </button>
    <button matListItem mat-button [class.active]="buttonState.stations" (click)="onToggleTool('stations')">
      {{ "names.showStations" | translate }}
    </button>
    <button matListItem mat-button [class.active]="buttonState.buffers" (click)="onToggleTool('buffers')">
      {{ "names.showBuffers" | translate }}
    </button>
    <button matListItem mat-button [class.active]="buttonState.groups" (click)="onToggleTool('groups')">
      {{ "names.showGroups" | translate }}
    </button>
    <button matListItem mat-button [class.active]="buttonState.clusters" (click)="onToggleTool('clusters')">
      {{ "names.showClusters" | translate }}
    </button>
    <button matListItem mat-button [class.active]="buttonState.overlaps" (click)="onToggleTool('overlaps')">
      {{ "names.showOverlaps" | translate }}
    </button>
  </mat-list>
</mde-popover>
