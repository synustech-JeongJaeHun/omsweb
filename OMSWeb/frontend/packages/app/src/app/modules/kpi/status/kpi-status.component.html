<div id="kpi-container" *ngIf="activated">
	<div class="area summary">
		<div class="gauge util">
			<div class="title" (click)="onClick('kpi')">
				{{ 'names.utilization' | translate }}
			</div>
			<div class="data" (click)="onClick('kpi')">{{ utilization }}%</div>
		</div>
		<div class="gauge delivery">
			<div class="title" (click)="onClick('kpi')">
				{{ 'names.deliveryTime' | translate }}
			</div>
			<div class="data" (click)="onClick('kpi')">{{ deliveryTime }}sec</div>
		</div>
		<div class="gauge cpu">
			<div class="title" (click)="onClick('kpi')">
				{{ 'names.cpu' | translate }} ({{ cpuGhz }}GHz)
			</div>
			<div class="data" (click)="onClick('kpi')">{{ cpuPercentage }}%</div>
		</div>
		<div class="gauge memory">
			<div class="title" (click)="onClick('kpi')">
				{{ 'names.mem' | translate }} ({{ memoryUsed }}/{{ memoryTotal }}GB)
			</div>
			<div class="data" (click)="onClick('kpi')">{{ memoryPercentage }}%</div>
		</div>
	</div>
</div>
