<div class="dialog-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragDisabled>
  <oms-dialog-base [title]="'names.alarms' | translate" [activeResize]="true">
    <ng-container class="dialog-layout">
      <div class="alert-list" cdkDragHandle>
        <dx-data-grid [dataSource]="dataSource" [remoteOperations]="true" [height]="300" [width]="700"
                      (onRowClick)="onClickRow($event)" [(selectedRowKeys)]="selectedIds" allowColumnResizing="true">
          <dxo-selection mode="single"></dxo-selection>
          <dxo-scrolling mode="virtual"></dxo-scrolling>
          <dxo-header-filter [visible]="true"></dxo-header-filter>
          <dxi-column [allowFiltering]="false" [width]="120" dataType="datetime" dataField="time"
            [caption]="'names.time' | translate" format="yyyy/MM/dd HH:mm:ss">
          </dxi-column>
          <dxi-column [allowFiltering]="false" [width]="90" dataType="string" dataField="age"
                      [caption]="'names.elapsed' | translate">
            <div *dxTemplate="let d of 'ageTemplate'">
              {{ transform(d.value) }}
            </div>
            <!--div *dxTemplate="let d of 'ageTemplate'">
              {{ (d.value / 60).toFixed(1) }}
            </div>-->
          </dxi-column>
          <dxi-column [allowFiltering]="true" [width]="110" dataType="string" dataField="vehicleId"
            [caption]="'names.vehicle' | translate"></dxi-column>
          <dxi-column [allowFiltering]="true" [width]="80" dataType="string" dataField="level" cellTemplate="levelTemplate"
            [caption]="'names.severity' | translate">
          </dxi-column>
          <dxi-column [allowFiltering]="true" [width]="80" dataType="string" dataField="errorCode"
            [caption]="'names.code' | translate"></dxi-column>
          <dxi-column [allowFiltering]="false" dataType="string" dataField="description"
            [caption]="'names.desc' | translate"></dxi-column>

          <div *dxTemplate="let data of 'levelTemplate'">
            <ng-container [ngSwitch]="data.displayValue">
              <div class="level0" *ngSwitchCase="0">Low ({{ data.text }})</div>
              <div class="level1" *ngSwitchCase="1">Warning ({{ data.text }})</div>
              <div class="level2" *ngSwitchCase="2">Critical ({{ data.text }})</div>
              <div *ngSwitchDefault></div>
            </ng-container>
          </div>
        </dx-data-grid>
      </div>

      <fieldset id="solutionContainer" *ngIf="currentItem">
        <legend>Vehicle #{{currentItem.vehicleId}} ({{currentItem.time | date: 'yyyy-MM-dd HH:mm:ss'}})</legend>

        <div class="grid-form" [ngSwitch]="hasControlAccess" [ngClass]="{'mobile': isMobile}">
          <mat-form-field class="dense" appearance="outline">
            <mat-label>{{'names.solution' | translate}}</mat-label>
            <textarea matInput readonly style="resize: none">{{currentItem.action}}</textarea>
          </mat-form-field>
          <mat-form-field class="dense" appearance="outline">
            <mat-label>{{'names.note' | translate}}</mat-label>
            <textarea matInput [placeholder]="'messages.alarmNoteHint'|translate" id="alaram_note"
              [(ngModel)]="alaram_note" [ngStyle]="isMobile&&{'resize': 'none'}"></textarea>
          </mat-form-field>
          <div class="grid-item">
            <div class="primary-actions-1">
              <button mat-raised-button color="primary" (click)="onModifySolution()" *ngSwitchCase="true">{{'names.modifySolution'|
                translate}}</button>
            </div>
            <div class="primary-actions">
              <button mat-raised-button color="primary" (click)="onReset()" *ngSwitchCase="true">{{'names.resetVehicle'| translate}}</button>
              <button mat-raised-button (click)="onClear()" *ngSwitchCase="true">{{'names.clear'| translate}}</button>
            </div>
          </div>
        </div>
      </fieldset>
    </ng-container>
  </oms-dialog-base>
  <!-- <div mat-dialog-content cdkDragHandle>
  </div> -->
</div>
