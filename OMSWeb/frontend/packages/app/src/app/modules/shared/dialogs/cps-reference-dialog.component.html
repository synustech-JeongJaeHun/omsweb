<oms-dialog-base [title]="'names.cpsReferenceValue' | translate">
	<ng-container class="dialog-layout">
		<div mat-dialog-content class="content-layout">
			<table mat-table #table [dataSource]="cpsDataSource">
				<ng-container matColumnDef="position">
					<th mat-header-cell *matHeaderCellDef class="th_no"> No. </th>
					<td mat-cell *matCellDef="let element"> {{element.position}} </td>
				</ng-container>
				<ng-container matColumnDef="name">
					<th mat-header-cell *matHeaderCellDef class="th_name"> Name </th>
					<td mat-cell *matCellDef="let element"> {{element.name}} </td>
				</ng-container>
				<ng-container matColumnDef="normal">
					<th mat-header-cell *matHeaderCellDef class="th_normal"> Normal </th>
					<td mat-cell *matCellDef="let element"> {{element.normal}} </td>
				</ng-container>
				<ng-container matColumnDef="warning">
					<th mat-header-cell *matHeaderCellDef class="th_warning"> Warning </th>
					<td mat-cell *matCellDef="let element"> {{element.warning}} </td>
				</ng-container>
				<ng-container matColumnDef="fault">
					<th mat-header-cell *matHeaderCellDef class="th_fault"> Fault </th>
					<td mat-cell *matCellDef="let element"> {{element.fault}} </td>
				</ng-container>

				<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
				<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
			</table>
		</div>
	</ng-container>
</oms-dialog-base>
