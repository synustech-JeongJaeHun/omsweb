<div class="dialog-container" cdkDrag 
     cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary=".cdk-overlay-container" 
     [cdkDragDisabled]="isMobile">
  <div class="pointer close-icon" (click)="close()" title="Close">
    <button mat-icon-button aria-label="Close" class="close" tabindex="-1">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <h3 mat-dialog-title class="mb-3" cdkDragHandle *ngIf="title">{{ title }}</h3>
  <ng-container *ngIf="isContentShow">
    <ng-content select=".dialog-layout"></ng-content>
  </ng-container>
</div>
