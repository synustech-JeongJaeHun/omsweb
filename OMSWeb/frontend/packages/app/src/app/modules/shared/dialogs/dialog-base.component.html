<div class="dialog-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane" [cdkDragDisabled]="isMobile">
  <div class="pointer minimize-icon" *ngIf="activeResize" (click)="reSize(isContentShow)" title="Minimize">
    <button mat-icon-button aria-label="Minimize" class="close" tabindex="-1">
      <mat-icon [style.transform]="isContentShow ? '':'rotate(180deg)'"
      >minimize</mat-icon>
    </button>
  </div>
  <div class="pointer close-icon" (click)="close()" title="Close">
    <button mat-icon-button aria-label="Close" class="close" tabindex="-1">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <h3 mat-dialog-title class="mb-3" cdkDragHandle *ngIf="title">{{ title }}</h3>
  <ng-container *ngIf="isContentShow">
    <ng-content select=".dialog-layout"></ng-content>
  </ng-container>
</div>
