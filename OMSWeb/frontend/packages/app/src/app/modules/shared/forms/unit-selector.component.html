<mat-form-field class="dense" appearance="outline">
  <input #inputValue matInput [formControl]="inputControl" [placeholder]="placeholder" [matAutocomplete]="auto" />
  <button mat-button *ngIf="selectedUnit" matSuffix mat-icon-button aria-label="Clear" [disabled]="disabled"
    (click)="onClear(inputValue)">
    <mat-icon>close</mat-icon>
  </button>

  <mat-autocomplete #auto="matAutocomplete" [autoActiveFirstOption]="false" [displayWith]="displayFn"
    (optionSelected)="onSelected($event.option.value)">
    <mat-option *ngFor="let item of targetOptions$ | async" [value]="item">
      <span>{{ item.logicalId }}</span>
      <span class="option-type">{{ item.objectType }}</span>
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
