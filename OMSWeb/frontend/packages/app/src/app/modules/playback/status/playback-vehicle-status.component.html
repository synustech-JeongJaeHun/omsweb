<dx-data-grid
	[dataSource]="dataSource"
	[remoteOperations]="true"
	[height]="tableHeight"
	[repaintChangesOnly]="true"
	[columnAutoWidth]="true"
	[showBorders]="false"
	[highlightChanges]="false"
	[showColumnLines]="true"
	[showRowLines]="true"
	[headerFilter]="false"
	[(selectedRowKeys)]="selectedRows"
	allowColumnResizing="true"
>
	<dxo-scrolling mode="virtual"></dxo-scrolling>
	<dxo-paging [pageSize]="50"></dxo-paging>
	<dxo-pager
		[showPageSizeSelector]="true"
		[allowedPageSizes]="[50, 100, 200]"
		[showInfo]="true"
		visible="true"
	>
	</dxo-pager>

	<dxo-selection [mode]="'none'" showCheckBoxesMode="always"></dxo-selection>
	<dxo-search-panel
		[placeholder]="'names.search' | translate"
		[visible]="true"
	></dxo-search-panel>
	<dxo-load-panel [enabled]="false"></dxo-load-panel>

	<dxi-column
		[allowFiltering]="false"
		[width]="50"
		dataType="string"
		dataField="id"
		sortOrder="desc"
		[caption]="'names.id' | translate"
	></dxi-column>
	<dxi-column
		[width]="85"
		dataType="string"
		dataField="physicalId"
		[caption]="'names.physicalId' | translate"
	>
	</dxi-column>
	<dxi-column
		[width]="85"
		dataType="string"
		dataField="logicalId"
		[caption]="'names.logicalId' | translate"
	>
	</dxi-column>
	<dxi-column
		[width]="40"
		dataType="string"
		dataField="mode"
		[caption]="'names.mode' | translate"
	></dxi-column>
	<dxi-column
		[allowFiltering]="false"
		[width]="40"
		dataType="boolean"
		dataField="canBePushed"
		[caption]="'names.canBePushed' | translate"
	></dxi-column>
	<dxi-column
		[allowFiltering]="false"
		[width]="90"
		dataType="boolean"
		[calculateCellValue]="calculateHostOrder"
		[caption]="'names.hostCommand' | translate"
	></dxi-column>
	<dxi-column
		[allowFiltering]="false"
		[width]="80"
		dataType="string"
		dataField="orderOrigin"
		[caption]="'names.orderOrigin' | translate"
	></dxi-column>
	<dxi-column
		[width]="60"
		dataType="string"
		dataField="lastPoint"
		[caption]="'names.curPoint' | translate"
	>
	</dxi-column>
	<dxi-column
		[width]="60"
		dataType="string"
		dataField="commandPoint"
		[allowSorting]="false"
		[caption]="'names.commandPoint' | translate"
	></dxi-column>
	<dxi-column
		[width]="50"
		dataType="string"
		dataField="orderId"
		[allowSorting]="false"
		[caption]="'names.orderId' | translate"
	></dxi-column>
	<dxi-column
		[width]="50"
		dataType="string"
		dataField="locationPickup"
		[caption]="'names.locationPickup' | translate"
	>
	</dxi-column>
	<dxi-column
		[width]="50"
		dataType="string"
		dataField="locationDropoff"
		[caption]="'names.locationDropoff' | translate"
	></dxi-column>
	<dxi-column
		[width]="80"
		dataType="string"
		dataField="movingState"
		[allowSorting]="false"
		[caption]="'names.movingState' | translate"
	></dxi-column>
	<dxi-column
		[width]="80"
		dataType="string"
		dataField="cargoState"
		[allowSorting]="false"
		[caption]="'names.cargoState' | translate"
	></dxi-column>
	<dxi-column
		[allowFiltering]="false"
		[width]="120"
		dataType="number"
		dataField="distanceTotal"
		[allowSorting]="false"
		[caption]="'names.distanceTotal' | translate"
	></dxi-column>
	<dxi-column
		[width]="80"
		[allowFiltering]="true"
		dataType="string"
		dataField="user"
		[allowSorting]="true"
		[caption]="'names.user' | translate"
	></dxi-column>
	<dxi-column
		[width]="150"
		[allowFiltering]="true"
		dataType="string"
		dataField="note"
		[allowSorting]="true"
		[caption]="'names.note' | translate"
	></dxi-column>
</dx-data-grid>
