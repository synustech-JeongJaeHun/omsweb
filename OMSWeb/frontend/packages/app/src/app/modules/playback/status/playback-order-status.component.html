<dx-data-grid [dataSource]="dataSource" [height]="tableHeight" [repaintChangesOnly]="true" [columnAutoWidth]="true"
  [showBorders]="false" [highlightChanges]="false" [showColumnLines]="true" [showRowLines]="true"
  [hoverStateEnabled]="true" [(selectedRowKeys)]="selectedRows" [headerFilter]="false" allowColumnResizing="true">
  <dxo-selection [mode]="'none'" showCheckBoxesMode="always"></dxo-selection>
  <!-- <dxo-scrolling mode="virtual"></dxo-scrolling> -->
  <dxo-paging [pageSize]="50"></dxo-paging>
  <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[50, 100, 200]" [showInfo]="true" visible="true">
  </dxo-pager>
  <dxo-search-panel [placeholder]="'names.search' | translate" [visible]="true"></dxo-search-panel>
  <dxo-load-panel [enabled]="false"></dxo-load-panel>

  <!--<dxi-column [width]="80" dataType="string" dataField="id" sortOrder="asc" [caption]="'names.id' | translate">
  </dxi-column>
  <dxi-column [width]="80" dataType="string" dataField="vehicleId" [caption]="'names.vehicleId' | translate"
    [customizeText]="transformVehicleId"></dxi-column>
  <dxi-column [width]="140" dataType="string" dataField="locationPickup" [caption]="'names.locationPickup' | translate"
    [customizeText]="transformLocationId"></dxi-column>
  <dxi-column
    [width]="140" dataType="string" dataField="locationPickup" [caption]="'names.locationPickupAlias' | translate"
    [customizeText]="transformAlias"></dxi-column>
  <dxi-column [width]="140" dataType="string" dataField="locationDropoff"
    [caption]="'names.locationDropoff' | translate" [customizeText]="transformLocationId"></dxi-column>
  <dxi-column
    [width]="140" dataType="string" dataField="locationDropoff" [caption]="'names.locationDropoffAlias' | translate"
    [customizeText]="transformAlias"></dxi-column>

  <dxi-column [width]="120" dataType="string" dataField="carrierLabel" [allowSorting]="false"
    [caption]="'names.carrierLabel' | translate"></dxi-column>
  <dxi-column [width]="150" dataType="datetime" dataField="timeCreated" [format]="dateTimeFormat" [caption]="'names.timeCreated' | translate">
  </dxi-column>
  <dxi-column [width]="150" dataType="datetime" dataField="timeAssigned" [format]="dateTimeFormat" [caption]="'names.timeAssigned' | translate">
  </dxi-column>
  <dxi-column [width]="100" dataType="string" dataField="state" [caption]="'names.state' | translate"></dxi-column>
  <dxi-column [width]="80" dataType="string" dataField="priority" [caption]="'names.priority' | translate"></dxi-column>-->

  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_id')"
    dataType="string"
    dataField="id"
    [caption]="getDisplayTableLabel('orders_id') | translate"    cellTemplate="statusDetailsTemplate"
    [visible]="canDisplayTable('orders_id')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_id')"
  ></dxi-column>
  <dxi-column
    [allowFiltering]="true"
    [width]="getDisplayTableColumnWidth('orders_origin')"
    dataType="string"
    dataField="origin"
    [allowSorting]="true"
    [caption]="getDisplayTableLabel('orders_origin') | translate"
    cellTemplate="statusDetailsTemplate"
    [visible]="canDisplayTable('orders_origin')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_origin')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_logicalId')"
    dataType="string"
    dataField="logicalId"
    [caption]="getDisplayTableLabel('orders_logicalId') | translate"
    cellTemplate="statusDetailsTemplate"
    [visible]="canDisplayTable('orders_logicalId')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_logicalId')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_priority')"
    dataType="string"
    dataField="priority"
    [caption]="getDisplayTableLabel('orders_priority') | translate"
    [visible]="canDisplayTable('orders_priority')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_priority')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_state')"
    dataType="string"
    dataField="state"
    [caption]="getDisplayTableLabel('orders_state') | translate"
    [visible]="canDisplayTable('orders_state')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_state')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_vehicleId')"
    dataType="string"
    dataField="vehicleId"
    [caption]="getDisplayTableLabel('orders_vehicleId') | translate"
    [visible]="canDisplayTable('orders_vehicleId')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_vehicleId')"
    [customizeText]="transformVehicleId"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_vehicleAlias')"
    dataType="string"
    dataField="vehicleId"
    [caption]="getDisplayTableLabel('orders_vehicleAlias') | translate"
    [visible]="canDisplayTable('orders_vehicleAlias')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_vehicleAlias')"
    [customizeText]="transformVehicleAlias"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_locationPickup')"
    dataType="string"
    dataField="locationPickup"
    [caption]="getDisplayTableLabel('orders_locationPickup') | translate"
    [customizeText]="transformLocationId"
    [visible]="canDisplayTable('orders_locationPickup')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_locationPickup')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_locationPickupAlias')"
    dataType="string"
    dataField="locationPickupAlias"
    [caption]="getDisplayTableLabel('orders_locationPickupAlias') | translate"
    
    [visible]="canDisplayTable('orders_locationPickupAlias')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_locationPickupAlias')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_locationDropoff')"
    dataType="string"
    dataField="locationDropoff"
    [caption]="getDisplayTableLabel('orders_locationDropoff') | translate"
    [customizeText]="transformLocationId"
    [visible]="canDisplayTable('orders_locationDropoff')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_locationDropoff')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_locationDropoffAlias')"
    dataType="string"
    dataField="locationDropoffAlias"
    [caption]="getDisplayTableLabel('orders_locationDropoffAlias') | translate"
    
    [visible]="canDisplayTable('orders_locationDropoffAlias')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_locationDropoffAlias')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_locationMove')"
    dataType="string"
    dataField="locationMove"
    [allowFiltering]="true"
    [allowSorting]="false"
    [caption]="getDisplayTableLabel('orders_locationMove') | translate"
    [visible]="canDisplayTable('orders_locationMove')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_locationMove')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_carrierLabel')"
    dataType="string"
    dataField="carrierLabel"
    [allowSorting]="false"
    [caption]="getDisplayTableLabel('orders_carrierLabel') | translate"
    [visible]="canDisplayTable('orders_carrierLabel')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_carrierLabel')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_timeCreated')"
    dataType="datetime"
    dataField="timeCreated"
    [caption]="getDisplayTableLabel('orders_timeCreated') | translate"
    sortOrder="desc"
    [visible]="canDisplayTable('orders_timeCreated')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_timeCreated')"
  ></dxi-column>
  <dxi-column
    [width]="getDisplayTableColumnWidth('orders_timeAssigned')"
    dataType="datetime"
    dataField="timeAssigned"
    [caption]="getDisplayTableLabel('orders_timeAssigned') | translate"
    sortOrder="desc"
    [visible]="canDisplayTable('orders_timeAssigned')"
    [visibleIndex]="getDisplayTableColumnIndex('orders_timeAssigned')"
  ></dxi-column>

  <dxi-column
    [allowFiltering]="false"
    [width]="0"
    [visible]="false"
    dataType="string"
    dataField="statusDetails"
    [allowSorting]="false"
    [caption]="'names.statusDetails' | translate"
  ></dxi-column>

  <div *dxTemplate="let data of 'lastReassignTypeTemplate'">
    <div [ngSwitch]="data.displayValue">
      <div class="value" *ngSwitchCase="'S'">{{ 'Swap' }}</div>
      <div class="value" *ngSwitchCase="'M'">{{ 'Manual' }}</div>
      <div class="value" *ngSwitchDefault>{{ data.displayValue }}</div>
    </div>
  </div>
  <div *dxTemplate="let data of 'statusDetailsTemplate'">
    <div
      class="value"
      [ngStyle]="{ 'background-color': getBgColor(0, data.data.statusDetails) }"
    >
      {{ data.displayValue }}
    </div>
  </div>
  <div *dxTemplate="let data of 'aliasTemplate'">
    {{ data?.displayValue? vhlAlias+data?.displayValue : '' }}
  </div>
</dx-data-grid>
