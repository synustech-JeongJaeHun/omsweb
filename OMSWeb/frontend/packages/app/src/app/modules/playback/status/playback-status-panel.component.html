<div
	id="status-control-container"
	(mouseup)="resizeViewerStop($event)"
	(mouseleave)="resizeViewerStop($event)"
>
	<div
		id="resize-handle"
		(mousedown)="resizeViewerStart()"
		(dblclick)="viewerHide()"
	></div>
	<button
		mat-flat-button
		id="close-button"
		class="dense"
		(click)="viewerHide()"
	>
		<mat-icon>expand_more</mat-icon>
	</button>
	<mat-tab-group
		class="tab-group"
		[(selectedIndex)]="currentTab"
		(selectedIndexChange)="onChangeTab($event)"
		animationDuration="0ms"
	>
		<mat-tab [label]="labelDisplayTable('orders_label') | translate"
             *ngIf="canDisplayTable('orders')">
			<oms-playback-order-status
        *ngIf="onTabIndex('orders')"
				[tableHeight]="tableHeight"
			></oms-playback-order-status>
		</mat-tab>
		<mat-tab [label]="labelDisplayTable('vehicles_label') | translate"
             *ngIf="canDisplayTable('vehicles')">
			<oms-playback-vehicle-status
        *ngIf="onTabIndex('vehicles')"
				[tableHeight]="tableHeight"
			></oms-playback-vehicle-status>
		</mat-tab>
		<mat-tab [label]="labelDisplayTable('stations_label') | translate"
            *ngIf="canDisplayTable('stations')">
			<oms-playback-station-status
        *ngIf="onTabIndex('stations')"
				[tableHeight]="tableHeight"
			></oms-playback-station-status>
		</mat-tab>
		<mat-tab *ngIf="bufferEnabled&& canDisplayTable('buffers')"
             [label]="labelDisplayTable('buffers_label') | translate">
			<oms-playback-buffer-status
        *ngIf="onTabIndex('buffers')"
				[tableHeight]="tableHeight"
			></oms-playback-buffer-status>
		</mat-tab>
		<mat-tab [label]="labelDisplayTable('zcus_label') | translate"
            *ngIf="canDisplayTable('zcus')">
			<oms-playback-zcu-status
        *ngIf="onTabIndex('zcus')"
				[tableHeight]="tableHeight"
			></oms-playback-zcu-status>
		</mat-tab>
	</mat-tab-group>
</div>
