<div
	id="status-control-container"
	(mouseup)="resizeViewerStop($event)"
	(mouseleave)="resizeViewerStop($event)"
>
	<div
		id="resize-handle"
		(mousedown)="resizeViewerStart()"
		(dblclick)="viewerHide()"
	></div>
	<button
		mat-flat-button
		id="close-button"
		class="dense"
		(click)="viewerHide()"
	>
		<mat-icon>expand_more</mat-icon>
	</button>
	<mat-tab-group
		class="tab-group"
		[(selectedIndex)]="currentTab"
		(selectedIndexChange)="onChangeTab($event)"
		animationDuration="0ms"
	>
		<mat-tab [label]="'names.transfer' | translate">
			<oms-playback-order-status
				*ngIf="currentTab == 0"
				[tableHeight]="tableHeight"
			></oms-playback-order-status>
		</mat-tab>
		<mat-tab [label]="'names.vehicles' | translate">
			<oms-playback-vehicle-status
				*ngIf="currentTab == 1"
				[tableHeight]="tableHeight"
			></oms-playback-vehicle-status>
		</mat-tab>
		<mat-tab [label]="'names.stations' | translate">
			<oms-playback-station-status
				*ngIf="currentTab === 2"
				[tableHeight]="tableHeight"
			></oms-playback-station-status>
		</mat-tab>
		<mat-tab *ngIf="bufferEnabled" [label]="'names.buffers' | translate">
			<oms-playback-buffer-status
				*ngIf="currentTab === 3"
				[tableHeight]="tableHeight"
			></oms-playback-buffer-status>
		</mat-tab>
		<mat-tab [label]="'names.zcus' | translate">
			<oms-playback-zcu-status
				*ngIf="bufferEnabled ? currentTab === 4 : currentTab === 3"
				[tableHeight]="tableHeight"
			></oms-playback-zcu-status>
		</mat-tab>
	</mat-tab-group>
</div>
