<div id="history-page">
	<div id="filter-area">
		<dx-date-box [placeholder]="'_START_DATE' | translate"
								 type="datetime"
								 [(value)]="start"
								 [min]="base"
								 [max]="end"
								 [acceptCustomValue]="false"
								 [showClearButton]="true"
								 [displayFormat]="dateTimeFormat"
								 #startDate></dx-date-box>
		<div>~</div>
		<dx-date-box [placeholder]="'_END_DATE' | translate"
								 type="datetime"
								 [(value)]="now"
								 [min]="base"
								 [max]="end"
								 [acceptCustomValue]="false"
								 [showClearButton]="true"
								 (validationErrorChange)="setDateWithMaxLimit()"
								 [displayFormat]="dateTimeFormat"
								 #endDate></dx-date-box>
		<div id="search-area">
			<button mat-raised-button
							color="primary"
							(click)="search(startDate.value, endDate.value)">
				{{ 'names.search' | translate }}
			</button>
			<label> {{ searchTime }}</label>
		</div>
    <div id="playback-area">
      <dx-button icon="video" text="Play Back" (onClick)="playBack()"
      ></dx-button>
    </div>
	</div>
	<div id="grid-container">
		<dx-data-grid [dataSource]="dataSource"
									[columnAutoWidth]="true"
									[remoteOperations]="true"
									[height]="gridHeight"
									[width]="gridWidth"
									[showBorders]="true"
									[hoverStateEnabled]="true"
									allowColumnResizing="true"
                  id="data-grid"
                  (onContextMenuPreparing)="onContextMenuPreparing($event)"
                  (onCellClick)="cellSelected($event)"
                  [stateStoring]="stateStoring">
      <dxo-selection
        selectAllMode="allPages"
        [allowSelectAll]="false"
        showCheckBoxesMode="onClick"
        mode="multiple"></dxo-selection>
			<dxo-export [enabled]="true" [fileName]="fileName"></dxo-export>
			<dxo-paging [pageSize]="50"></dxo-paging>
			<dxo-pager [showPageSizeSelector]="true"
								 [allowedPageSizes]="[50, 100, 200]"
								 [showInfo]="true"
								 visible="true">
			</dxo-pager>
			<dxo-scrolling mode="standard"
										 rowRenderingMode="standard"
										 showScrollbar="always"></dxo-scrolling>
			<dxo-search-panel [placeholder]="'names.search' | translate"
												[visible]="true"></dxo-search-panel>
			<dxo-header-filter [visible]="true"></dxo-header-filter>
			<dxo-filter-row [visible]="true"></dxo-filter-row>

			<dxi-column [visible]="canDisplayTable('transfers_logical_id')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_logical_id')"
									[width]="getDisplayTableColumnWidth('transfers_logical_id')"
									dataType="string"
									dataField="logicalId"
									[caption]="'names.commandId' | translate"
									[fixed]="true"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_id')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_id')"
									[width]="getDisplayTableColumnWidth('transfers_id')"
									dataType="string"
									dataField="historySourceId"
									sortOrder="desc"
									[caption]="'names.id' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_origin')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_origin')"
									[width]="getDisplayTableColumnWidth('transfers_origin')"
									dataType="string"
									dataField="origin"
									[caption]="'names.origin' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_priority')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_priority')"
									[width]="getDisplayTableColumnWidth('transfers_priority')"
									dataType="number"
									dataField="priority"
									[caption]="'names.priority' | translate">
			</dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_state')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_state')"
									[width]="getDisplayTableColumnWidth('transfers_state')"
									dataType="string"
									dataField="state"
									[caption]="'names.state' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_vehicle_id')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_vehicle_id')"
									[width]="getDisplayTableColumnWidth('transfers_vehicle_id')"
									dataType="string"
									dataField="vehicleId"
									[caption]="'names.vehicleId' | translate">
			</dxi-column>
      <dxi-column [visible]="canDisplayTable('transfers_vehicle_alias')"
                  [visibleIndex]="getDisplayTableColumnIndex('transfers_vehicle_alias')"
                  [width]="getDisplayTableColumnWidth('transfers_vehicle_alias')"
                  dataType="string"
                  dataField="vehicleAlias"
                  cellTemplate="aliasTemplate"
                  [caption]="'names.vehicleAlias' | translate">
      </dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_location_pickup')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_location_pickup')"
									[width]="getDisplayTableColumnWidth('transfers_location_pickup')"
									dataType="string"
									dataField="locationPickup"
									[caption]="'names.locationPickup' | translate"
									[customizeText]="transformLocationId"></dxi-column>
      <dxi-column
                  [width]="getDisplayTableColumnWidth('transfers_location_pickup_alias')"
                  dataType="string"
                  dataField="locationPickupAlias"
                  [caption]="'names.locationPickupAlias' | translate"
                  [customizeText]="transformLocationId"
                  [visible]="canDisplayTable('transfers_location_pickup_alias')"
                  [visibleIndex]="getDisplayTableColumnIndex('transfers_location_pickup_alias')"
      ></dxi-column>

			<dxi-column [visible]="canDisplayTable('transfers_location_dropoff')"
									[visibleIndex]="
					getDisplayTableColumnIndex('transfers_location_dropoff')
				"
									[width]="getDisplayTableColumnWidth('transfers_location_dropoff')"
									dataType="string"
									dataField="locationDropoff"
									[caption]="'names.locationDropoff' | translate"
									[customizeText]="transformLocationId"></dxi-column>
      <dxi-column
                  [width]="getDisplayTableColumnWidth('transfers_location_dropoff_alias')"
                  dataType="string"
                  dataField="locationDropoffAlias"
                  [caption]="'names.locationDropoffAlias' | translate"
                  [customizeText]="transformLocationId"
                  [visible]="canDisplayTable('transfers_location_dropoff_alias')"
                  [visibleIndex]="getDisplayTableColumnIndex('transfers_location_dropoff_alias')"
      ></dxi-column>

			<dxi-column [visible]="canDisplayTable('transfers_location_move')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_location_move')"
									[width]="getDisplayTableColumnWidth('transfers_location_move')"
									dataType="string"
									dataField="locationMove"
									[caption]="'names.locationMove' | translate"
									[customizeText]="transformLocationId"></dxi-column>
      <dxi-column [visible]="canDisplayTable('transfers_from_distance')"
                  [visibleIndex]="getDisplayTableColumnIndex('transfers_from_distance')"
                  [width]="getDisplayTableColumnWidth('transfers_from_distance')"
                  dataType="number"
                  dataField="fromDistance"
                  cellTemplate="distanceTemplate"
                  [caption]="'names.fromDistance' | translate"></dxi-column>
      <dxi-column [visible]="canDisplayTable('transfers_to_distance')"
                  [visibleIndex]="getDisplayTableColumnIndex('transfers_to_distance')"
                  [width]="getDisplayTableColumnWidth('transfers_to_distance')"
                  dataType="number"
                  dataField="toDistance"
                  cellTemplate="distanceTemplate"
                  [caption]="'names.toDistance' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_carrier_label')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_carrier_label')"
									[width]="getDisplayTableColumnWidth('transfers_carrier_label')"
									dataType="string"
									dataField="carrierLabel"
									[allowSorting]="false"
									[caption]="'names.carrierLabel' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_time_created')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_time_created')"
									[width]="getDisplayTableColumnWidth('transfers_time_created')"
									dataType="datetime"
									dataField="timeCreated"
									[caption]="'names.timeCreated' | translate"
									[format]="dateTimeFormat"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_time_assigned')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_time_assigned')"
									[width]="getDisplayTableColumnWidth('transfers_time_assigned')"
									dataType="datetime"
									dataField="timeAssigned"
									[caption]="'names.timeAssigned' | translate"
									[format]="dateTimeFormat"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_time_completed')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_time_completed')"
									[width]="getDisplayTableColumnWidth('transfers_time_completed')"
									dataType="datetime"
									dataField="timeCompleted"
									[caption]="'names.timeCompleted' | translate"
									[format]="dateTimeFormat"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_time_aborted')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_time_aborted')"
									[width]="getDisplayTableColumnWidth('transfers_time_aborted')"
									dataType="datetime"
									dataField="timeAborted"
									[caption]="'names.timeAborted' | translate"
									[format]="dateTimeFormat"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_time_failed')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_time_failed')"
									[width]="getDisplayTableColumnWidth('transfers_time_failed')"
									dataType="datetime"
									dataField="timeFailed"
									[caption]="'names.timeFailed' | translate"
									[format]="dateTimeFormat"></dxi-column>
			<dxi-column [visible]="canDisplayTable('transfers_result_code')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_result_code')"
									[width]="getDisplayTableColumnWidth('transfers_result_code')"
									dataType="string"
									dataField="resultCode"
									cellTemplate="reasonTemplate"
									[caption]="'names.reason' | translate"></dxi-column>
			<div *dxTemplate="let data of 'reasonTemplate'">
				<div [ngSwitch]="data.displayValue">
					<div class="value" *ngSwitchCase="'SourceInterlockError'">{{ 'Source PIO Timeout' }}</div>
					<div class="value" *ngSwitchCase="'DestInterlockError'">{{ 'Dest PIO Timeout' }}</div>
					<div class="value" *ngSwitchDefault>{{ data.displayValue }}</div>
				</div>
			</div>
			<dxi-column [visible]="canDisplayTable('transfers_age')"
									[visibleIndex]="getDisplayTableColumnIndex('transfers_age')"
									[width]="getDisplayTableColumnWidth('transfers_age')"
									dataType="int"
									dataField="age"
									[caption]="'names.elapsed' | translate"></dxi-column>
			<div *dxTemplate="let data of 'ageTemplate'">
				{{ transform(data.displayValue) }}
			</div>
			<dxi-column [visible]="canDisplayTable('transfers_unload_retry_cnt')"
									[visibleIndex]="
					getDisplayTableColumnIndex('transfers_unload_retry_cnt')
				"
									[width]="getDisplayTableColumnWidth('transfers_unload_retry_cnt')"
									dataType="number"
									dataField="unloadRetryCnt"
									[caption]="'names.unloadRetryCount' | translate">
			</dxi-column>
			<div *dxTemplate="let data of 'distanceTemplate'">
				{{ transform_distance(data.displayValue) }}
			</div>
      <div *dxTemplate="let data of 'aliasTemplate'">
        {{ data?.displayValue? vhlAlias+data?.displayValue : '' }}
      </div>
		</dx-data-grid>
	</div>
</div>
