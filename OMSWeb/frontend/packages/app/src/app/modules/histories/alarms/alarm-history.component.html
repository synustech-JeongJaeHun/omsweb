<div id="history-page">
  <div id="filter-area">
    <!-- <dx-select-box
      [items]="VehicleListAll"
      [placeholder]="'_VEHICLE' | translate"
      [dataSource]="VehicleListAll"
      displayExpr="OnlineName"
      valueExpr="Id"
      [searchEnabled]="true"
      [showClearButton]="true"
      #vehicle
    ></dx-select-box>
    <dx-select-box
      [items]="AlarmcodeListAll"
      [placeholder]="'_ALARMCODE' | translate"
      [dataSource]="AlarmcodeListAll"
      displayExpr="_id"
      valueExpr="_id"
      [searchEnabled]="true"
      [showClearButton]="true"
      #alarmcode
    ></dx-select-box> -->
    <dx-date-box [placeholder]="'_START_DATE' | translate" type="datetime" [(value)]="start" [min]="base" [max]="end"
      [acceptCustomValue]="false" [showClearButton]="true" [displayFormat]="dateTimeFormat" #startDate></dx-date-box>
    <div>~</div>
    <dx-date-box [placeholder]="'_END_DATE' | translate" type="datetime" [(value)]="now" [min]="base" [max]="end"
      [acceptCustomValue]="false" [showClearButton]="true" (validationErrorChange)="setDateWithMaxLimit()"
      [displayFormat]="dateTimeFormat" #endDate></dx-date-box>
    <button mat-raised-button color="primary" (click)="search(startDate.value, endDate.value)">
      {{ "names.search" | translate }}
    </button>
  </div>
  <div id="grid-container">
    <dx-data-grid [dataSource]="dataSource" [columnAutoWidth]="true" [remoteOperations]="true" [height]="gridHeight"
                  [width]="gridWidth" [showBorders]="true" [hoverStateEnabled]="true" allowColumnResizing="true">
      <dxo-export [enabled]="true" [fileName]="fileName"></dxo-export>
      <dxo-paging [pageSize]="50"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[50, 100, 200]" [showInfo]="true" visible="true">
      </dxo-pager>
      <dxo-scrolling mode="standard" rowRenderingMode="standard" showScrollbar="always"></dxo-scrolling>
      <dxo-search-panel [placeholder]="'names.search' | translate" [visible]="true"></dxo-search-panel>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-filter-row [visible]="true"></dxo-filter-row>

      <dxi-column [width]="160" dataType="string" dataField="vehicleLogicalId" [caption]="'names.vehicle' | translate">
      </dxi-column>
      <dxi-column [width]="320" dataType="string" dataField="description" [caption]="'names.alarmName' | translate">
      </dxi-column>
      <dxi-column [width]="120" dataType="string" dataField="level" cellTemplate="levelTemplate"
                  [caption]="'names.level' | translate"></dxi-column>
      <dxi-column [width]="120" dataType="number" dataField="errorCode" [caption]="'names.errorCode' | translate">
      </dxi-column>
      <dxi-column [width]="320" dataType="string" dataField="cause" [caption]="'names.cause' | translate"></dxi-column>
      <dxi-column [width]="100" dataType="string" dataField="cleared" [caption]="'names.cleared' | translate">
      </dxi-column>
      <dxi-column [width]="120" dataType="datetime" dataField="time" sortOrder="desc"
                  [caption]="'names.time' | translate" [format]="dateTimeFormat"></dxi-column>
      <dxi-column [width]="120" dataType="datetime" dataField="timeResolved"
                  [caption]="'names.timeResolved' | translate" [format]="dateTimeFormat"></dxi-column>
      <!--
  <dxi-column [width]="120" dataType="number" dataField="age" [caption]="'names.age' | translate"
    cellTemplate="ageTemplate"></dxi-column>
    -->
      <dxi-column [width]="120" dataType="number" dataField="age" [caption]="'names.age' | translate"></dxi-column>
      <dxi-column [width]="120" dataType="number" dataField="current" [caption]="'names.current' | translate">
      </dxi-column>
      <div *dxTemplate="let data of 'ageTemplate'">
        {{ data.displayValue / 60 | number: "1.1-2" }}
      </div>
      <div *dxTemplate="let data of 'levelTemplate'">
        <ng-container [ngSwitch]="data.displayValue">
          <div class="level0" *ngSwitchCase="0">Low</div>
          <div class="level1" *ngSwitchCase="1">Warning</div>
          <div class="level2" *ngSwitchCase="2">Critical</div>
          <div *ngSwitchDefault></div>
        </ng-container>
        {{ data.text }}
      </div>
    </dx-data-grid>
  </div>
</div>
