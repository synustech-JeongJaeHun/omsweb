<div id="history-page">
	<div id="filter-area">
		<dx-date-box
			[placeholder]="'_START_DATE' | translate"
			type="datetime"
			[(value)]="start"
			[min]="base"
			[max]="end"
			[acceptCustomValue]="false"
			[showClearButton]="true"
			[displayFormat]="dateTimeFormat"
			#startDate
		></dx-date-box>
		<div>~</div>
		<dx-date-box
			[placeholder]="'_END_DATE' | translate"
			type="datetime"
			[(value)]="now"
			[min]="base"
			[max]="end"
			[acceptCustomValue]="false"
			[showClearButton]="true"
			(validationErrorChange)="setDateWithMaxLimit()"
			[displayFormat]="dateTimeFormat"
			#endDate
		></dx-date-box>
		<div id="search-area">
			<button mat-raised-button
							color="primary"
							(click)="search(startDate.value, endDate.value)">
				{{ 'names.search' | translate }}
			</button>
			<label> {{ searchTime }}</label>
		</div>
    <div id="playback-area">
      <dx-button icon="video" text="Play Back" (onClick)="playBack()"
      ></dx-button>
    </div>
	</div>
	<div id="grid-container">
		<dx-data-grid
			[dataSource]="dataSource"
			[columnAutoWidth]="true"
			[remoteOperations]="true"
			[height]="gridHeight"
			[width]="gridWidth"
			[showBorders]="true"
			[hoverStateEnabled]="true"
			allowColumnResizing="true"
      (onContextMenuPreparing)="onContextMenuPreparing($event)"
      (onCellClick)="cellSelected($event)"
			[stateStoring]="stateStoring"
		>
      <dxo-selection
        selectAllMode="allPages"
        [allowSelectAll]="false"
        showCheckBoxesMode="onClick"
        mode="multiple"></dxo-selection>
			<dxo-export [enabled]="true" [fileName]="fileName"></dxo-export>
			<dxo-paging [pageSize]="50"></dxo-paging>
			<dxo-pager
				[showPageSizeSelector]="true"
				[allowedPageSizes]="[50, 100, 200]"
				[showInfo]="true"
				visible="true"
			>
			</dxo-pager>
			<dxo-scrolling
				mode="standard"
				rowRenderingMode="standard"
				showScrollbar="always"
			></dxo-scrolling>
			<dxo-search-panel
				[placeholder]="'names.search' | translate"
				[visible]="true"
			></dxo-search-panel>
			<dxo-header-filter [visible]="true"></dxo-header-filter>
			<dxo-filter-row [visible]="true"></dxo-filter-row>

			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_vehicle_logical_id')"
				[visible]="canDisplayTable('alarms_vehicle_logical_id')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_vehicle_logical_id')"
				dataType="string"
				dataField="vehicleLogicalId"
				[caption]="'names.vehicle' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_description')"
				[visible]="canDisplayTable('alarms_description')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_description')"
				dataType="string"
				dataField="description"
				[caption]="'names.alarmName' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_level')"
				[visible]="canDisplayTable('alarms_level')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_level')"
				dataType="string"
				dataField="level"
				cellTemplate="levelTemplate"
				[caption]="'names.level' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_error_code')"
				[visible]="canDisplayTable('alarms_error_code')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_error_code')"
				dataType="number"
				dataField="errorCode"
				[caption]="'names.errorCode' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_cause')"
				[visible]="canDisplayTable('alarms_cause')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_cause')"
				dataType="string"
				dataField="cause"
				[caption]="'names.cause' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_cleared')"
				[visible]="canDisplayTable('alarms_cleared')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_cleared')"
				dataType="boolean"
				dataField="cleared"
				[caption]="'names.cleared' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_time')"
				[visible]="canDisplayTable('alarms_time')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_time')"
				dataType="datetime"
				dataField="time"
				sortOrder="desc"
				[caption]="'names.time' | translate"
				[format]="dateTimeFormat"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_time_resolved')"
				[visible]="canDisplayTable('alarms_time_resolved')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_time_resolved')"
				dataType="datetime"
				dataField="timeResolved"
				[caption]="'names.timeReset' | translate"
				[format]="dateTimeFormat"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_age')"
				[visible]="canDisplayTable('alarms_age')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_age')"
				dataType="int"
				dataField="age"
				[caption]="'names.elapsed' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('alarms_current')"
				[visible]="canDisplayTable('alarms_current')"
				[visibleIndex]="getDisplayTableColumnIndex('alarms_current')"
				dataType="string"
				dataField="current"
				[caption]="'names.point' | translate"
			></dxi-column>
      <dxi-column
        [width]="getDisplayTableColumnWidth('physical_id')"
        [visible]="canDisplayTable('physical_id')"
        [visibleIndex]="getDisplayTableColumnIndex('physical_id')"
        dataType="string"
        dataField="physicalId"
        [caption]="'names.barcode' | translate"
      ></dxi-column>

			transform
			<div *dxTemplate="let data of 'ageTemplate'">
				{{ transform(data.displayValue) }}
			</div>
			<!--div *dxTemplate="let data of 'ageTemplate'">
        {{ data.displayValue / 60 | number: "1.1-2" }}
      </div>-->
			<div *dxTemplate="let data of 'levelTemplate'">
				<ng-container [ngSwitch]="data.displayValue">
					<div class="level0" *ngSwitchCase="0">Low</div>
					<div class="level1" *ngSwitchCase="1">Warning</div>
					<div class="level2" *ngSwitchCase="2">Critical</div>
					<div *ngSwitchDefault></div>
				</ng-container>
				{{ data.text }}
			</div>
		</dx-data-grid>
	</div>
</div>
