<div id="history-page">
	<div id="filter-area">
		<dx-date-box
			[placeholder]="'_START_DATE' | translate"
			type="datetime"
			[(value)]="start"
			[min]="base"
			[max]="end"
			[acceptCustomValue]="false"
			[showClearButton]="true"
			[displayFormat]="dateTimeFormat"
			#startDate
		></dx-date-box>
		<div>~</div>
		<dx-date-box
			[placeholder]="'_END_DATE' | translate"
			type="datetime"
			[(value)]="now"
			[min]="base"
			[max]="end"
			[acceptCustomValue]="false"
			[showClearButton]="true"
			(validationErrorChange)="setDateWithMaxLimit()"
			[displayFormat]="dateTimeFormat"
			#endDate
		></dx-date-box>
		<button
			mat-raised-button
			color="primary"
			(click)="search(startDate.value, endDate.value)"
		>
			{{ 'names.search' | translate }}
		</button>
	</div>
	<div id="grid-container">
		<dx-data-grid
			[dataSource]="dataSource"
			[columnAutoWidth]="true"
			[remoteOperations]="true"
			[height]="gridHeight"
			[width]="gridWidth"
			[showBorders]="true"
			[hoverStateEnabled]="true"
			allowColumnResizing="true"
			[stateStoring]="stateStoring"
		>
			<dxo-export [enabled]="true" [fileName]="fileName"></dxo-export>
			<dxo-paging [pageSize]="50"></dxo-paging>
			<dxo-pager
				[showPageSizeSelector]="true"
				[allowedPageSizes]="[50, 100, 200]"
				[showInfo]="true"
				visible="true"
			>
			</dxo-pager>
			<dxo-scrolling
				mode="standard"
				rowRenderingMode="standard"
				showScrollbar="always"
			></dxo-scrolling>
			<dxo-search-panel
				[placeholder]="'names.search' | translate"
				[visible]="true"
			></dxo-search-panel>
			<dxo-header-filter [visible]="true"></dxo-header-filter>
			<dxo-filter-row [visible]="true"></dxo-filter-row>
			<!-- dataField json에 맞게 수정필요 -->
			<dxi-column
				[width]="getDisplayTableColumnWidth('nack_RCMD')"
				[visible]="canDisplayTable('nack_RCMD')"
				[visibleIndex]="getDisplayTableColumnIndex('nack_RCMD')"
				dataType="string"
				dataField="RCMD"
				[caption]="'names.RCMD' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('nack_command_id')"
				[visible]="canDisplayTable('nack_command_id')"
				[visibleIndex]="getDisplayTableColumnIndex('nack_command_id')"
				dataType="string"
				dataField="logicalId"
				[caption]="'names.commandId' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('nack_source')"
				[visible]="canDisplayTable('nack_source')"
				[visibleIndex]="getDisplayTableColumnIndex('nack_source')"
				[allowFiltering]="true"
				dataType="string"
				dataField="source"
				[caption]="'names.source' | translate"
			></dxi-column>
			<!-- cellTemplate="distanceTotalTemplate" -->
			<dxi-column
				[width]="getDisplayTableColumnWidth('nack_dest')"
				[visible]="canDisplayTable('nack_dest')"
				[visibleIndex]="getDisplayTableColumnIndex('nack_dest')"
				[allowFiltering]="true"
				dataType="string"
				dataField="dest"
				[caption]="'names.dest' | translate"
			></dxi-column>
			<!-- cellTemplate="runtimeTotalTemplate" -->
			<dxi-column
				[width]="getDisplayTableColumnWidth('nack_carrier_id')"
				[visible]="canDisplayTable('nack_carrier_id')"
				[visibleIndex]="getDisplayTableColumnIndex('nack_carrier_id')"
				dataType="string"
				dataField="carrierId"
				[caption]="'names.carrierId' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('nack_nak_code')"
				[visible]="canDisplayTable('nack_nak_code')"
				[visibleIndex]="getDisplayTableColumnIndex('nack_nak_code')"
				dataType="string"
				dataField="nakCode"
				[caption]="'names.code' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('nack_nak_reason')"
				[visible]="canDisplayTable('nack_nak_reason')"
				[visibleIndex]="getDisplayTableColumnIndex('nack_nak_reason')"
				dataType="string"
				dataField="reason"
				[caption]="'names.reason' | translate"
			></dxi-column>
			<dxi-column
				[width]="getDisplayTableColumnWidth('nack_nak_param')"
				[visible]="canDisplayTable('nack_nak_param')"
				[visibleIndex]="getDisplayTableColumnIndex('nack_nak_param')"
				dataType="string"
				dataField="param"
				[caption]="'names.param' | translate"
			></dxi-column>
			<!-- dataField="commandId" -->
			<!-- <div *dxTemplate="let data of 'distanceTotalTemplate'">
				{{ data.displayValue / 1000000 | number: '1.0-0' }}km
			</div>
			<div *dxTemplate="let data of 'runtimeTotalTemplate'">
				{{ data.displayValue / (3600 * 24) | number: '1.0-0' }}d
				{{ (data.displayValue % (3600 * 24)) / 3600 | number: '2.0-1' }}h
			</div> -->
		</dx-data-grid>
	</div>
</div>
