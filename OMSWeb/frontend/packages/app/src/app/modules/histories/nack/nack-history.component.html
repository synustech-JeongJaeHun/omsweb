<div id="history-page">
	<div id="filter-area">
		<dx-date-box
			[placeholder]="'_START_DATE' | translate"
			type="datetime"
			[(value)]="start"
			[min]="base"
			[max]="end"
			[acceptCustomValue]="false"
			[showClearButton]="true"
			[displayFormat]="dateTimeFormat"
			#startDate
		></dx-date-box>
		<div>~</div>
		<dx-date-box
			[placeholder]="'_END_DATE' | translate"
			type="datetime"
			[(value)]="now"
			[min]="base"
			[max]="end"
			[acceptCustomValue]="false"
			[showClearButton]="true"
			(validationErrorChange)="setDateWithMaxLimit()"
			[displayFormat]="dateTimeFormat"
			#endDate
		></dx-date-box>
		<button
			mat-raised-button
			color="primary"
			(click)="search(startDate.value, endDate.value)"
		>
			{{ 'names.search' | translate }}
		</button>
	</div>
	<div id="grid-container">
		<dx-data-grid [dataSource]="dataSource"
									[columnAutoWidth]="true"
									[remoteOperations]="true"
									[height]="gridHeight"
									[width]="gridWidth"
									[showBorders]="true"
									[hoverStateEnabled]="true"
									allowColumnResizing="true"
									[stateStoring]="stateStoring">
			<dxo-export [enabled]="true" [fileName]="fileName"></dxo-export>
			<dxo-paging [pageSize]="50"></dxo-paging>
			<dxo-pager [showPageSizeSelector]="true"
								 [allowedPageSizes]="[50, 100, 200]"
								 [showInfo]="true"
								 visible="true">
			</dxo-pager>
			<dxo-scrolling mode="standard"
										 rowRenderingMode="standard"
										 showScrollbar="always"></dxo-scrolling>
			<dxo-search-panel [placeholder]="'names.search' | translate"
												[visible]="true"></dxo-search-panel>
			<dxo-header-filter [visible]="true"></dxo-header-filter>
			<dxo-filter-row [visible]="true"></dxo-filter-row>
			<dxi-column [visible]="canDisplayTable('nacks_stream_function')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_stream_function')"
									[width]="getDisplayTableColumnWidth('nacks_stream_function')"
									dataType="string"
									dataField="request"
									[caption]="'names.streamFunction' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_rcmd')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_rcmd')"
									[width]="getDisplayTableColumnWidth('nacks_rcmd')"
									dataType="string"
									dataField="rcmd"
									[caption]="'names.rcmd' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_command_id')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_command_id')"
									[width]="getDisplayTableColumnWidth('nacks_command_id')"
									dataType="string"
									dataField="commandID"
									[caption]="'names.commandId' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_time')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_time')"
									[width]="getDisplayTableColumnWidth('nacks_time')"
									dataType="datetime"
									dataField="modifiedTime"
									[caption]="'names.time' | translate"
									[format]="dateTimeFormat"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_origin')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_origin')"
									[width]="getDisplayTableColumnWidth('nacks_origin')"
									dataType="string"
									dataField="origin"
									[caption]="'names.origin' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_source')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_source')"
									[width]="getDisplayTableColumnWidth('nacks_source')"
									dataType="string"
									dataField="sourceName"
									[allowSorting]="false"
									[caption]="'names.source' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_dest')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_dest')"
									[width]="getDisplayTableColumnWidth('nacks_dest')"
									dataType="string"
									dataField="destName"
									[allowSorting]="false"
									[caption]="'names.dest' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_carrier_id')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_carrier_id')"
									[width]="getDisplayTableColumnWidth('nacks_carrier_id')"
									dataType="string"
									dataField="carrierID"
									[allowSorting]="false"
									[caption]="'names.carrierId' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_carrier_loc')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_carrier_loc')"
									[width]="getDisplayTableColumnWidth('nacks_carrier_loc')"
									dataType="string"
									dataField="carrierLoc"
									[allowSorting]="false"
									[caption]="'names.carrierLoc' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_code')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_code')"
									[width]="getDisplayTableColumnWidth('nacks_code')"
									dataType="string"
									dataField="nack"
									[allowSorting]="false"
									[caption]="'names.nackCode' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_reason')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_reason')"
									[width]="getDisplayTableColumnWidth('nacks_reason')"
									dataType="string"
									dataField="nackReason"
									[allowSorting]="false"
									[caption]="'names.nackReason' | translate"></dxi-column>
			<dxi-column [visible]="canDisplayTable('nacks_param')"
									[visibleIndex]="getDisplayTableColumnIndex('nacks_param')"
									[width]="getDisplayTableColumnWidth('nacks_param')"
									dataType="string"
									dataField="nackParam"
									[allowSorting]="false"
									[caption]="'names.nackParam' | translate"></dxi-column>
		</dx-data-grid>
	</div>
</div>
