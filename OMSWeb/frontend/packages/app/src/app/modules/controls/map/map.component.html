<div id="history-page">
  <div id="grid-container">
    <dx-data-grid [dataSource]="dataSource"
                  [columnAutoWidth]="true"
                  [remoteOperations]="true"
                  [showBorders]="true"
                  [hoverStateEnabled]="true"
                  height="90vh"
                  (onCellClick)="downloadJsonUri($event)"
                  allowColumnResizing="true">
      <dxo-paging [pageSize]="50"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true"
                 [allowedPageSizes]="[50, 100, 200]"
                 [showInfo]="true"
                 visible="true">
      </dxo-pager>
      <dxo-scrolling mode="standard"
                     rowRenderingMode="standard"
                     showScrollbar="always"></dxo-scrolling>
      <dxo-search-panel [placeholder]="'names.search' | translate"
                        [visible]="true"></dxo-search-panel>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-filter-row [visible]="true"></dxo-filter-row>

      <!--<dxi-column dataType="number"
                  dataField="id"
                  [caption]="'names.id' | translate"
                  [fixed]="true"></dxi-column>-->

      <dxi-column dataType="number"
                  dataField="dbVersion"
                  sortOrder="desc"
                  [caption]="'names.mapVersion' | translate"
                  [fixed]="true"></dxi-column>
      <dxi-column dataType="string"
                  dataField="dbName"
                  [caption]="'names.mapName' | translate"
                  ></dxi-column>
      <dxi-column dataType="string"
                  dataField="srcMapFile"
                  [caption]="'names.fileName' | translate"
                  ></dxi-column>
      <dxi-column dataType="string"
                  dataField="author"
                  [caption]="'names.authors' | translate"
                  ></dxi-column>
      <dxi-column dataType="datetime"
                  dataField="timeModified"
                  [caption]="'names.timeModified' | translate"
                  [format]="dateTimeFormat"
                  ></dxi-column>
      <!--<dxi-column dataType="string"
                  dataField="contents"
                  cellTemplate="down"
                  [caption]="'names.contents' | translate"
                  [width]="80"
                  >
      </dxi-column>-->

      <div *dxTemplate="let data of 'down'">
        <button mat-stroked-button>
          <mat-icon>download</mat-icon>
        </button>
      </div>
    </dx-data-grid>
  </div>
</div>
