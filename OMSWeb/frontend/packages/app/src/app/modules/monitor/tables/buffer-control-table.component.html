<div class="grid-actions" *ngIf="hasControlAccess">
	<button
		mat-stroked-button
		color="primary"
		class="dense accent"
		[disabled]="!canControl"
		(click)="onUnuse()"
	>
		{{ 'names.unuse' | translate }}
	</button>
	<button
		mat-stroked-button
		color="primary"
		class="dense accent"
		[disabled]="!canControl"
		(click)="onUse()"
	>
		{{ 'names.use' | translate }}
	</button>
</div>
<dx-data-grid
	[dataSource]="dataSource"
	[remoteOperations]="true"
	[height]="tableHeight"
	[repaintChangesOnly]="true"
	[columnAutoWidth]="false"
	[showBorders]="false"
	[highlightChanges]="true"
	[showColumnLines]="true"
	[showRowLines]="true"
	[headerFilter]="false"
	[(selectedRowKeys)]="selectedRows"
	allowColumnResizing="true"
	[stateStoring]="stateStoring"
>
	<dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
	<!--dxo-scrolling mode="virtual" rowRenderingMode="standard"></dxo-scrolling-->
	<dxo-paging [pageSize]="50"></dxo-paging>
	<dxo-pager
		[showPageSizeSelector]="true"
		[allowedPageSizes]="[50, 100, 200]"
		[showInfo]="true"
		visible="true"
	>
	</dxo-pager>
	<dxo-search-panel
		[placeholder]="'names.search' | translate"
		[visible]="true"
	></dxo-search-panel>
	<dxo-load-panel [enabled]="false"></dxo-load-panel>
	<dxo-filter-row [visible]="true"></dxo-filter-row>

	<dxi-column
		dataType="string"
		dataField="id"
		[caption]="'names.id' | translate"
		[visible]="canDisplayTable('buffers_id')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_id')"
    [width]="getDisplayTableColumnWidth('buffers_id')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="physicalId"
		[caption]="'names.physicalId' | translate"
		[visible]="canDisplayTable('buffers_physicalId')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_physicalId')"
    [width]="getDisplayTableColumnWidth('buffers_physicalId')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="logicalId"
		[caption]="'names.logicalId' | translate"
		[visible]="canDisplayTable('buffers_logicalId')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_logicalId')"
    [width]="getDisplayTableColumnWidth('buffers_logicalId')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="groupId"
		[caption]="'names.group' | translate"
		[visible]="canDisplayTable('buffers_group')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_group')"
    [width]="getDisplayTableColumnWidth('buffers_group')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="point"
		[caption]="'names.point' | translate"
		[visible]="canDisplayTable('buffers_point')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_point')"
    [width]="getDisplayTableColumnWidth('buffers_point')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="direction"
		[caption]="'names.direction' | translate"
		cellTemplate="directionTemplate"
		[visible]="canDisplayTable('buffers_direction')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_direction')"
    [width]="getDisplayTableColumnWidth('buffers_direction')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="nextPoint"
		[caption]="'names.nextPoint' | translate"
		[visible]="canDisplayTable('buffers_nextPoint')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_nextPoint')"
    [width]="getDisplayTableColumnWidth('buffers_nextPoint')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="offset"
		[caption]="'names.offset' | translate"
		[visible]="canDisplayTable('buffers_offset')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_offset')"
    [width]="getDisplayTableColumnWidth('buffers_offset')"
	></dxi-column>
	<dxi-column
		dataType="boolean"
		dataField="unuse"
		[caption]="'names.unuse' | translate"
		[visible]="canDisplayTable('buffers_unuse')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_unuse')"
    [width]="getDisplayTableColumnWidth('buffers_unuse')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="carrierId"
		[caption]="'names.carrierId' | translate"
		[visible]="canDisplayTable('buffers_carrierId')"
    [visibleIndex]="getDisplayTableColumnIndex('buffers_carrierId')"
    [width]="getDisplayTableColumnWidth('buffers_carrierId')"
	></dxi-column>
	<div *dxTemplate="let data of 'directionTemplate'">
		<div [ngSwitch]="data.displayValue">
			<div class="value" *ngSwitchCase="'L'">{{ 'Left' }}</div>
			<div class="value" *ngSwitchCase="'R'">{{ 'Right' }}</div>
			<div class="value" *ngSwitchCase="'U'">{{ 'Under' }}</div>
			<div class="value" *ngSwitchDefault>{{ data.displayValue }}</div>
		</div>
	</div>
</dx-data-grid>
