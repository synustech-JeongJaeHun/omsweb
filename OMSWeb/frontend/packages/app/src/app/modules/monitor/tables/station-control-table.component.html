<div class="grid-actions" *ngIf="hasControlAccess">
  <button mat-stroked-button color="primary" class="dense accent" [disabled]="!canControl" (click)="onUnuse()">
    {{ "names.unuse" | translate }}
  </button>
  <button mat-stroked-button color="primary" class="dense accent" [disabled]="!canControl" (click)="onUse()">
    {{ "names.use" | translate }}
  </button>

</div>
<dx-data-grid [dataSource]="dataSource" [remoteOperations]="true" [height]="tableHeight" [repaintChangesOnly]="true"
              [columnAutoWidth]="false" [showBorders]="false" [highlightChanges]="true" [showColumnLines]="true"
              [showRowLines]="true" [headerFilter]="false" [(selectedRowKeys)]="selectedRows" allowColumnResizing="true">
  <dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
  <!--dxo-scrolling-- mode="virtual" rowRenderingMode="standard"></dxo-scrolling-->
  <dxo-paging [pageSize]="50"></dxo-paging>
  <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[50, 100, 200]" [showInfo]="true" visible="true">
  </dxo-pager>
  <dxo-search-panel [placeholder]="'names.search' | translate" [visible]="true"></dxo-search-panel>
  <dxo-load-panel [enabled]="false"></dxo-load-panel>
  <dxo-filter-row [visible]="true"></dxo-filter-row>

  <dxi-column [width]="50" dataType="int" dataField="id" [caption]="'names.id' | translate"
              *ngIf="canDisplayTable('stations_id')"></dxi-column>
  <dxi-column [width]="120" dataType="string" dataField="physicalId" [caption]="'names.physicalId' | translate"
              *ngIf="canDisplayTable('stations_physicalId')"></dxi-column>
  <dxi-column [width]="120" dataType="string" dataField="logicalId" [caption]="'names.logicalId' | translate"
              *ngIf="canDisplayTable('stations_logicalId')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="groupId" [caption]="'names.group' | translate"
              *ngIf="canDisplayTable('stations_group')"></dxi-column>
  <dxi-column [width]="100" dataType="string" dataField="point" [caption]="'names.point' | translate"
              *ngIf="canDisplayTable('stations_point')"></dxi-column>
  <dxi-column [width]="100" dataType="string" dataField="direction" [caption]="'names.direction' | translate"
              cellTemplate="directionTemplate" *ngIf="canDisplayTable('stations_direction')"></dxi-column>
  <dxi-column [width]="100" dataType="string" dataField="nextPoint" [caption]="'names.nextPoint' | translate"
              *ngIf="canDisplayTable('stations_nextPoint')"></dxi-column>
  <dxi-column [width]="100" dataType="string" dataField="offset" [caption]="'names.offset' | translate"
              *ngIf="canDisplayTable('stations_offset')"></dxi-column>
  <dxi-column [width]="100" dataType="boolean" dataField="unuse" [caption]="'names.unuse' | translate"
              *ngIf="canDisplayTable('stations_unuse')"></dxi-column>
  <dxi-column [width]="100" dataType="string" dataField="carrierId" [caption]="'names.carrierId' | translate"
              *ngIf="canDisplayTable('stations_carrierId')"></dxi-column>
  <div *dxTemplate="let data of 'directionTemplate'">
    <div [ngSwitch]="data.displayValue">
      <div class="value" *ngSwitchCase="'L'">{{ 'Left' }}</div>
      <div class="value" *ngSwitchCase="'R'">{{ 'Right' }}</div>
      <div class="value" *ngSwitchCase="'U'">{{ 'Under' }}</div>
      <div class="value" *ngSwitchDefault>{{ data.displayValue }}</div>
    </div>
  </div>
</dx-data-grid>
