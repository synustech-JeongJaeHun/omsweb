<div class="grid-actions" *ngIf="hasControlAccess">
  <button
    mat-stroked-button
    color="primary"
    class="dense accent"
    [disabled]="!canReset"
    (click)="onReset(useTypeZcu)"
    *ngIf="useTypeZcu"
  >
    {{ 'names.reset' | translate }}
  </button>

	<button
		mat-stroked-button
		color="primary"
		class="dense accent"
		[disabled]="!canReset"
		(click)="onReset()"
    *ngIf="!useTypeZcu"
	>
		{{ 'names.HWReset' | translate }}
	</button>
  <button
    mat-stroked-button
    color="primary"
    class="dense accent"
    [disabled]="!canReset"
    (click)="onReset('sw')"
    *ngIf="!useTypeZcu"
  >
    {{ 'names.SWReset' | translate }}
  </button>
	<button
		mat-stroked-button
		color="primary"
		class="dense accent"
		[disabled]="!canReset"
		(click)="onSetHw()"
    *ngIf="!useTypeZcu"
	>
		{{ 'names.setHw' | translate }}
	</button>
	<button
		mat-stroked-button
		color="primary"
		class="dense accent"
		[disabled]="!canReset"
		(click)="onSetSw()"
    *ngIf="!useTypeZcu"
	>
		{{ 'names.setSw' | translate }}
	</button>

  <button
    mat-stroked-button
    *ngIf="holdEnabled"
    color="primary"
    class="dense accent"
    [disabled]="!canReset"
    (click)="onResetHold()"
  >
    {{ 'names.reset-hold' | translate }}
  </button>
  <button
    mat-stroked-button
    *ngIf="holdEnabled"
    color="primary"
    class="dense accent"
    [disabled]="!canReset"
    (click)="onRelease()"
  >
    {{ 'names.hold-release' | translate }}
  </button>
</div>

<dx-data-grid
	[dataSource]="dataSource"
	[remoteOperations]="true"
	[height]="tableHeight"
	[repaintChangesOnly]="true"
	[columnAutoWidth]="false"
	[showBorders]="false"
	[highlightChanges]="true"
	[showColumnLines]="true"
	[showRowLines]="true"
	[headerFilter]="false"
	[(selectedRowKeys)]="selectedRows"
	allowColumnResizing="true"
	[stateStoring]="stateStoring"
>
	<dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
	<!--dxo-scrolling-- mode="virtual" rowRenderingMode="standard"></dxo-scrolling-->
	<dxo-paging [pageSize]="50"></dxo-paging>
	<dxo-pager
		[showPageSizeSelector]="true"
		[allowedPageSizes]="[50, 100, 200]"
		[showInfo]="true"
		visible="true"
	>
	</dxo-pager>
	<dxo-search-panel
		[placeholder]="'names.search' | translate"
		[visible]="true"
	></dxo-search-panel>
	<dxo-load-panel [enabled]="false"></dxo-load-panel>
	<dxo-filter-row [visible]="true"></dxo-filter-row>

	<dxi-column
		dataType="string"
		dataField="id"
		[caption]="'names.id' | translate"
		[visible]="canDisplayTable('zcus_id')"
		[visibleIndex]="getDisplayTableColumnIndex('zcus_id')"
		[width]="getDisplayTableColumnWidth('zcus_id')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="usingType"
		[caption]="'names.usingType' | translate"
		[visible]="canDisplayTable('zcus_using_type')"
		[visibleIndex]="getDisplayTableColumnIndex('zcus_using_type')"
		[width]="getDisplayTableColumnWidth('zcus_using_type')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="zcuType"
		[caption]="'names.zcuType' | translate"
		[visible]="canDisplayTable('zcus_type')"
		[visibleIndex]="getDisplayTableColumnIndex('zcus_type')"
		[width]="getDisplayTableColumnWidth('zcus_type')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="status"
		[caption]="'names.status' | translate"
		cellTemplate="statusTemplate"
		[visible]="canDisplayTable('zcus_status')"
		[visibleIndex]="getDisplayTableColumnIndex('zcus_status')"
		[width]="getDisplayTableColumnWidth('zcus_status')"
	></dxi-column>

  <ng-container *ngIf="zcuDetail">
    <dxi-column
      dataType="string"
      dataField="logicalId"
      [caption]="'names.logicalId' | translate"
      [visible]="canDisplayTable('zcus_logicalId')"
      [visibleIndex]="getDisplayTableColumnIndex('zcus_logicalId')"
      [width]="getDisplayTableColumnWidth('zcus_logicalId')"
    ></dxi-column>
    <dxi-column
      dataType="string"
      dataField="passVehicle"
      [caption]="'names.passVehicle' | translate"
      [visible]="canDisplayTable('zcus_passVehicle')"
      [visibleIndex]="getDisplayTableColumnIndex('zcus_passVehicle')"
      [width]="getDisplayTableColumnWidth('zcus_passVehicle')"
    ></dxi-column>
    <dxi-column
      dataType="string"
      dataField="vehicleCount"
      [caption]="'names.vehicleCount' | translate"
      [visible]="canDisplayTable('zcus_vehicleCount')"
      [visibleIndex]="getDisplayTableColumnIndex('zcus_vehicleCount')"
      [width]="getDisplayTableColumnWidth('zcus_vehicleCount')"
    ></dxi-column>
    <dxi-column
      dataType="string"
      dataField="vehicleInfo"
      [caption]="'names.vehicleInfo' | translate"
      [visible]="canDisplayTable('zcus_vehicleInfo')"
      [visibleIndex]="getDisplayTableColumnIndex('zcus_vehicleInfo')"
      [width]="getDisplayTableColumnWidth('zcus_vehicleInfo')"
    ></dxi-column>
  </ng-container>

  <dxi-column
    dataType="string"
    dataField="errorCode"
    [caption]="'names.errorCode' | translate"
    [visible]="canDisplayTable('zcus_errorCode')"
    [visibleIndex]="getDisplayTableColumnIndex('zcus_errorCode')"
    [width]="getDisplayTableColumnWidth('zcus_errorCode')"
  ></dxi-column>

	<div *dxTemplate="let data of 'statusTemplate'">
		<div
			class="value"
			[ngStyle]="{ 'background-color': getBgColor(0, data.displayValue) }"
		>
			{{ data.displayValue }}
		</div>
	</div>
</dx-data-grid>
