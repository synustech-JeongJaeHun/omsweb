<div id="loading-bar" *ngIf="loadingState">
	Loading ...
	<mat-progress-bar
		mode="indeterminate"
		aria-label="Loading"
	></mat-progress-bar>
</div>
<ng-container *ngIf="indicatorFireEmergency && fireEmergency">
  <div style="width: 100%;
              height: 0.4em;
              top: 0;
              left: 0;"
       class="bound"
  ></div>
  <div style="width: 100%;
              height: 0.4em;
              bottom: 0;
              left: 0;"
       class="bound"
  ></div>
  <div style="width: 0.4em;
              height: 100%;
              top: 0;
              left: 0;"
       class="bound"
  ></div>
  <div style="width: 0.4em;
              height: 100%;
              top: 0;
              right: 0;"
       class="bound"
  ></div>
</ng-container>

<oms-map-viewer
	*ngIf="ready"
	[preference]="mapPreference"
	[viewMode]="viewMode"
	class="map-viewer"
	[trackData]="trackData"
	[findEvent]="findEvent"
	[focusEvent]="focusEvent"
	[dropFocusEvent]="dropFocusEvent"
  id="map-viewer"
>
</oms-map-viewer>

<div id="status-control" *ngIf="showControlTable">
	<oms-status-control
		(findAndFocus)="handleFindAndFocus($event)"
		(focus)="handleFocus($event)"
		(dropFocus)="handleDropFocus($event)"
	></oms-status-control>
</div>

<oms-kpi-status *ngIf="!isMobile"></oms-kpi-status>

<oms-vhl-status *ngIf="enabled && vhlDisplay && !isMobile" cdkDrag
                [cdkDragFreeDragPosition]="dragPosition"
                (cdkDragEnded)="dragEnded($event)"
></oms-vhl-status>
