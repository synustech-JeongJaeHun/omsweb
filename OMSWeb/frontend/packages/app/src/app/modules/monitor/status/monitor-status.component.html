<div id="loading-bar" *ngIf="loadingState">
	Loading ...
	<mat-progress-bar
		mode="indeterminate"
		aria-label="Loading"
	></mat-progress-bar>
</div>

<oms-map-viewer
	*ngIf="ready"
	[preference]="mapPreference"
	[viewMode]="viewMode"
	class="map-viewer"
	[trackData]="trackData"
	[findEvent]="findEvent"
	[focusEvent]="focusEvent"
	[dropFocusEvent]="dropFocusEvent"
  id="map-viewer"
>
</oms-map-viewer>

<div id="status-control" *ngIf="showControlTable">
	<oms-status-control
		(findAndFocus)="handleFindAndFocus($event)"
		(focus)="handleFocus($event)"
		(dropFocus)="handleDropFocus($event)"
	></oms-status-control>
</div>

<oms-kpi-status></oms-kpi-status>

<oms-vhl-status *ngIf="enabled && vhlDisplay" cdkDrag
                [cdkDragFreeDragPosition]="dragPosition"
                (cdkDragEnded)="dragEnded($event)"
></oms-vhl-status>
