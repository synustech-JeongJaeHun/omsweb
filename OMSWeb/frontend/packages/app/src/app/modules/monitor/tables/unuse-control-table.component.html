<div class="grid-actions" *ngIf="hasControlAccess"></div>

<dx-data-grid
	[dataSource]="dataSource"
	[remoteOperations]="true"
	[height]="tableHeight"
	[repaintChangesOnly]="true"
	[columnAutoWidth]="false"
	[showBorders]="false"
	[highlightChanges]="true"
	[showColumnLines]="true"
	[showRowLines]="true"
	[headerFilter]="false"
	allowColumnResizing="true"
	[stateStoring]="stateStoring"
	[sorting]="true"
>
	<dxo-sorting mode="single"></dxo-sorting>
	<dxo-paging [pageSize]="50"></dxo-paging>
	<dxo-pager
		[showPageSizeSelector]="true"
		[allowedPageSizes]="[50, 100, 200]"
		[showInfo]="true"
		visible="true"
	>
	</dxo-pager>
	<dxo-search-panel
		[placeholder]="'names.search' | translate"
		[visible]="true"
	></dxo-search-panel>
	<dxo-load-panel [enabled]="false"></dxo-load-panel>
	<dxo-filter-row [visible]="true"></dxo-filter-row>

	<dxi-column
		dataType="string"
		dataField="type"
		[caption]="'names.type' | translate"
		[visible]="canDisplayTable('unuse_type')"
		[visibleIndex]="getDisplayTableColumnIndex('unuse_type')"
		[width]="getDisplayTableColumnWidth('unuse_type')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="logicalId"
		sortOrder="desc"
		[caption]="'names.logicalId' | translate"
		[visible]="canDisplayTable('unuse_logical_id')"
		[visibleIndex]="getDisplayTableColumnIndex('unuse_logical_id')"
		[width]="getDisplayTableColumnWidth('unuse_logical_id')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="user"
		[caption]="'names.user' | translate"
		[visible]="canDisplayTable('unuse_user')"
		[visibleIndex]="getDisplayTableColumnIndex('unuse_user')"
		[width]="getDisplayTableColumnWidth('unuse_user')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="note"
		[caption]="'names.note' | translate"
		[visible]="canDisplayTable('unuse_note')"
		[visibleIndex]="getDisplayTableColumnIndex('unuse_note')"
		[width]="getDisplayTableColumnWidth('unuse_note')"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="unusedTime"
		[caption]="'names.timeUnused' | translate"
		[visible]="canDisplayTable('unuse_unused_time')"
		[visibleIndex]="getDisplayTableColumnIndex('unuse_unused_time')"
		[width]="getDisplayTableColumnWidth('unuse_unused_time')"
	></dxi-column>
	<dxi-column
		type="buttons"
		[caption]="'names.location' | translate"
		[visible]="canDisplayTable('unuse_location')"
		[visibleIndex]="getDisplayTableColumnIndex('unuse_location')"
		[width]="getDisplayTableColumnWidth('unuse_location')"
	>
		<dxi-button [text]="'names.view' | translate" [onClick]="handleClickView">
		</dxi-button>
	</dxi-column>
</dx-data-grid>
