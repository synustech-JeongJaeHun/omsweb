<div class="grid-actions" *ngIf="hasControlAccess"></div>

<dx-data-grid
	[dataSource]="dataSource"
	[remoteOperations]="true"
	[height]="tableHeight"
	[repaintChangesOnly]="true"
	[columnAutoWidth]="false"
	[showBorders]="false"
	[highlightChanges]="true"
	[showColumnLines]="true"
	[showRowLines]="true"
	[headerFilter]="false"
	allowColumnResizing="true"
	[sorting]="true"
>
	<dxo-sorting mode="single"></dxo-sorting>
	<dxo-paging [pageSize]="50"></dxo-paging>
	<dxo-pager
		[showPageSizeSelector]="true"
		[allowedPageSizes]="[50, 100, 200]"
		[showInfo]="true"
		visible="true"
	>
	</dxo-pager>
	<dxo-search-panel
		[placeholder]="'names.search' | translate"
		[visible]="true"
	></dxo-search-panel>
	<dxo-load-panel [enabled]="false"></dxo-load-panel>
	<dxo-filter-row [visible]="true"></dxo-filter-row>

	<dxi-column
		dataType="string"
		dataField="type"
		[caption]="'names.type' | translate"
		width="100"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="onlineName"
		[caption]="'names.logicalId' | translate"
		width="200"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="user"
		[caption]="'names.user' | translate"
		width="100"
	></dxi-column>
	<dxi-column
		dataType="string"
		dataField="comments"
		[caption]="'names.note' | translate"
		width="400"
	></dxi-column>
	<dxi-column
		dataType="datetime"
		dataField="unuseTime"
		sortOrder="desc"
		[format]="dateTimeFormat"
		[caption]="'names.timeUnused' | translate"
		width="150"
	></dxi-column>
	<dxi-column
		type="buttons"
		[caption]="'names.location' | translate"
		width="100"
	>
		<dxi-button [text]="'names.view' | translate" [onClick]="handleClickView">
		</dxi-button>
	</dxi-column>
</dx-data-grid>
