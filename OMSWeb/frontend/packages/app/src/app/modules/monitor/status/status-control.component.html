<div
	id="status-control-container"
	(mouseup)="resizeViewerStop($event)"
	(mouseleave)="resizeViewerStop($event)"
  (touchend)="resizeViewerTouchStop($event)"
>
	<div
		id="resize-handle"
		(mousedown)="resizeViewerStart()"
		(dblclick)="viewerHide()"
    (touchstart)="resizeViewerTouchStart()"
  ></div>
	<button
		mat-flat-button
		id="resize-button"
		class="dense"
		(mousedown)="resizeViewerStart()"
		(dblclick)="viewerHide()"
    (touchstart)="resizeViewerTouchStart()"
  >
		<mat-icon>height</mat-icon>
	</button>
	<button
		mat-flat-button
		id="close-button"
		class="dense"
		(click)="viewerHide()"
	>
		<mat-icon>expand_more</mat-icon>
	</button>
	<div id="status-toolbar" *ngIf="canControl && !isMobile">
		<button
			*ngIf="
				hasPermissions([
					permissionEnums.SettingSegment,
					permissionEnums.SettingStation,
					permissionEnums.SettingBuffer,
					permissionEnums.SettingVehicle
				])
			"
			mat-stroked-button
			class="dense"
			(click)="onViewUnusedList()"
		>
			<mat-icon style="visibility: hidden; width: 0px"
				>disabled_by_default</mat-icon
			>
			<span>{{ 'names.unusedList' | translate }}</span>
		</button>
		<button
			*ngIf="
				hasPermissions([permissionEnums.ResetAllVehicle]) &&
				canDisplayTable('vehicles')
			"
			mat-stroked-button
			class="dense"
			(click)="onVehicleReset()"
		>
			<mat-icon>settings_backup_restore</mat-icon>
			<span>{{ 'names.resetAllVehicle' | translate }}</span>
		</button>
		<button
			*ngIf="
				hasPermissions([permissionEnums.AutoAllVehicle]) &&
				canDisplayTable('vehicles')
			"
			mat-stroked-button
			class="dense"
			(click)="onSetAuto()"
		>
			<mat-icon>brightness_auto</mat-icon>
			<span>{{ 'names.autoAllVehicle' | translate }}</span>
		</button>
	</div>
	<mat-tab-group
    style="overscroll-behavior-y: contain"
		class="tab-group"
		[(selectedIndex)]="currentTab"
		(selectedIndexChange)="onChangeTab($event)"
		animationDuration="0ms" #tabGroup
	>
		<mat-tab
			[label]="'names.transfer' | translate"
			*ngIf="canDisplayTable('orders')"
		>
			<oms-order-control-table
        *ngIf="onTabIndex('orders')"
				[tableHeight]="tableHeight"
				(focus)="focus.emit($event)"
				(dropFocus)="dropFocus.emit($event)"
			>
			</oms-order-control-table>
		</mat-tab>
		<mat-tab
			[label]="'names.vehicles' | translate"
			*ngIf="canDisplayTable('vehicles')"
		>
			<oms-vehicle-control-table
        *ngIf="onTabIndex('vehicles')"
				[tableHeight]="tableHeight"
			>
			</oms-vehicle-control-table>
		</mat-tab>
		<!-- Stations / Buffers 추가 -->
		<mat-tab
			[label]="'names.stations' | translate"
			*ngIf="canControl && canDisplayTable('stations') && !isMobile"
		>
			<oms-station-control-table
        *ngIf="onTabIndex('stations')"
				[tableHeight]="tableHeight"
			>
			</oms-station-control-table>
		</mat-tab>
		<mat-tab
			[label]="'names.buffers' | translate"
			*ngIf="bufferEnabled && canControl && canDisplayTable('buffers') && !isMobile"
		>
			<oms-buffer-control-table
				*ngIf="bufferEnabled && onTabIndex('buffers')"
				[tableHeight]="tableHeight"
			>
			</oms-buffer-control-table>
		</mat-tab>
		<!-- Stations / Buffers 추가 -->
		<!-- Zcu 추가 -->
		<mat-tab
			[label]="'names.zcu_label' | translate"
			*ngIf="canControl && canDisplayTable('zcus') && !isMobile"
		>
			<oms-zcu-control-table
        *ngIf="onTabIndex('zcus') || !isMobile"
				[tableHeight]="tableHeight"
			>
			</oms-zcu-control-table>
		</mat-tab>
		<!-- Zcu 추가 -->
		<!-- cps 추가 -->
		<mat-tab
			[label]="'names.cps' | translate"
			*ngIf="canControl && canDisplayTable('cps') && !isMobile"
		>
			<oms-cps-control-table
        *ngIf="onTabIndex('cps')"
				[tableHeight]="tableHeight"
			>
			</oms-cps-control-table>
		</mat-tab>
		<!-- cps 추가 -->

    <mat-tab
      [label]="'names.fcu' | translate"
      *ngIf="canControl && canDisplayTable('fcus')"
    >
      <oms-fcu-control-table
        *ngIf="onTabIndex('fcus')"
        [tableHeight]="tableHeight"
      >
      </oms-fcu-control-table>
    </mat-tab>
	</mat-tab-group>
</div>
