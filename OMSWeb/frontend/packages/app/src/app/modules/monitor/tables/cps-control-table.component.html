<div class="grid-actions" *ngIf="hasControlAccess">
</div>

<dx-data-grid [dataSource]="dataSource" [remoteOperations]="true" [height]="tableHeight" [repaintChangesOnly]="true"
              [columnAutoWidth]="false" [showBorders]="false" [highlightChanges]="true" [showColumnLines]="true"
              [showRowLines]="true" [headerFilter]="false" [(selectedRowKeys)]="selectedRows" allowColumnResizing="true">
  <dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
  <!--dxo-scrolling mode="virtual" rowRenderingMode="standard"></dxo-scrolling-->
  <dxo-paging [pageSize]="50"></dxo-paging>
  <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[50, 100, 200]" [showInfo]="true" visible="true">
  </dxo-pager>
  <dxo-search-panel [placeholder]="'names.search' | translate" [visible]="true"></dxo-search-panel>
  <dxo-load-panel [enabled]="false"></dxo-load-panel>
  <dxo-filter-row [visible]="true"></dxo-filter-row>

  <dxi-column [width]="70" dataType="string" dataField="id" [caption]="'names.cps_converter_id' | translate"
              *ngIf="canDisplayTable('cps_converter_id')"></dxi-column>
  <!--
  <dxi-column [width]="70" dataType="string" dataField="server_id" [caption]="'names.cps_server_id' | translate"
              *ngIf="canDisplayTable('cps_server_id')"></dxi-column>
  -->
  <dxi-column [width]="120" dataType="string" dataField="logicalId" [caption]="'names.logicalId' | translate"
              *ngIf="canDisplayTable('cps_logical_id')"></dxi-column>
  <dxi-column [width]="120" dataType="string" dataField="status" [caption]="'names.cps_status' | translate"
              cellTemplate="statusTemplate" *ngIf="canDisplayTable('cps_status')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="voltage" [caption]="'names.cps_voltage' | translate"
              cellTemplate="voltageTemplate" *ngIf="canDisplayTable('cps_voltage')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="current_igbt" [caption]="'names.cps_current_igbt' | translate"
              cellTemplate="currentIgbtTemplate" *ngIf="canDisplayTable('cps_current_igbt')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="current_track" [caption]="'names.cps_current_track' | translate"
              cellTemplate="currentTrackTemplate" *ngIf="canDisplayTable('cps_current_track')"></dxi-column>
  <dxi-column [width]="70" dataType="string" dataField="frequency" [caption]="'names.cps_frequency' | translate"
              *ngIf="canDisplayTable('cps_frequency')"></dxi-column>
  <dxi-column [width]="80" dataType="string" dataField="temp_radiator" [caption]="'names.cps_temp_radiator' | translate"
              cellTemplate="tempRadiatorTemplate" *ngIf="canDisplayTable('cps_temp_radiator')"></dxi-column>
  <dxi-column [width]="80" dataType="string" dataField="temp_internal" [caption]="'names.cps_temp_internal' | translate"
              cellTemplate="tempInternalTemplate" *ngIf="canDisplayTable('cps_temp_internal')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="sync" [caption]="'names.cps_sync' | translate"
              *ngIf="canDisplayTable('cps_sync')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="backup_id" [caption]="'names.cps_backup_id' | translate"
              *ngIf="canDisplayTable('cps_backup_id')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="error_code" [caption]="'names.cps_error_code' | translate"
              *ngIf="canDisplayTable('cps_error_code')"></dxi-column>
  <!--
  <dxi-column [width]="60" dataType="string" dataField="voltage_rs" [caption]="'names.cps_voltage_rs' | translate"
              *ngIf="canDisplayTable('cps_voltage_rs')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="voltage_st" [caption]="'names.cps_voltage_st' | translate"
              *ngIf="canDisplayTable('cps_voltage_st')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="voltage_tr" [caption]="'names.cps_voltage_tr' | translate"
              *ngIf="canDisplayTable('cps_voltage_tr')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="current_r" [caption]="'names.cps_current_r' | translate"
              *ngIf="canDisplayTable('cps_current_r')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="current_s" [caption]="'names.cps_current_s' | translate"
              *ngIf="canDisplayTable('cps_current_s')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="current_t" [caption]="'names.cps_current_t' | translate"
              *ngIf="canDisplayTable('cps_current_t')"></dxi-column>
  <dxi-column [width]="80" dataType="string" dataField="total_kw" [caption]="'names.cps_total_kw' | translate"
              *ngIf="canDisplayTable('cps_total_kw')"></dxi-column>
  <dxi-column [width]="60" dataType="string" dataField="wh" [caption]="'names.cps_wh' | translate"
              *ngIf="canDisplayTable('cps_wh')"></dxi-column>
    -->
  <div *dxTemplate="let data of 'statusTemplate'">
    <div class="value" [ngStyle]="{'background-color': getBgColor(0, data.displayValue) }">{{ data.displayValue }}</div>
  </div>
  <div *dxTemplate="let data of 'voltageTemplate'">
    <div class="value" [ngStyle]="{'background-color': getBgColor(1, data.displayValue) }">{{ data.displayValue }}</div>
  </div>
  <div *dxTemplate="let data of 'currentIgbtTemplate'">
    <div class="value" [ngStyle]="{'background-color': getBgColor(2, data.displayValue) }">{{ data.displayValue }}</div>
  </div>
  <div *dxTemplate="let data of 'currentTrackTemplate'">
    <div class="value" [ngStyle]="{'background-color': getBgColor(3, data.displayValue) }">{{ data.displayValue }}</div>
  </div>
  <div *dxTemplate="let data of 'tempRadiatorTemplate'">
    <div class="value" [ngStyle]="{'background-color': getBgColor(4, data.displayValue) }">{{ data.displayValue }}</div>
  </div>
  <div *dxTemplate="let data of 'tempInternalTemplate'">
    <div class="value" [ngStyle]="{'background-color': getBgColor(5, data.displayValue) }">{{ data.displayValue }}</div>
  </div>
</dx-data-grid>
