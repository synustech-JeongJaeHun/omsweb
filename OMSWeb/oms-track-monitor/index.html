<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oms-track-monitor</title>
</head>

<body style="padding: 0px; margin: 0px;">
  <!-- With Vue3 -->
  <!-- <div id="app"></div> -->

  <!-- With Web Component -->
  <oms-track-monitor id="track-canvas"></oms-track-monitor>
  <script type="module" src="/src/main.ts"></script>
  <script>
    const omsTrackMonitorElement = document.getElementById("track-canvas")

    function onResize() {
      const
        width = window.innerWidth,
        height = window.innerHeight

      omsTrackMonitorElement.width = parseInt(width)
      omsTrackMonitorElement.height = parseInt(height)
    }

    window.addEventListener('resize', onResize)
    onResize()
  </script>
</body>

</html>
