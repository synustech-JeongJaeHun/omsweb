[MessageManager]
host=localhost
port=1883
topic_root=oms

[DB]
host=localhost
port=5432
user=oms
pass=oms
name=semioht

[VehicleProcessor]
sleep_interval=10
initialize_vehicles_on_startup=false
push_check_time_limit=5
use_clusters=false
deadlock_time_limit=30
lost_carrier_time_limit=300
last_motion_time_limit=60
command_check_time_limit=5
transfer_before_arrival=false
log_times=false
use_avoid_looping=true
sensor_distance=1450
use_log=true
use_go_home=false
use_resolve_congestion=false
use_zcu=true
use_sn_first_routing=false
no_soon_arrive_length=2
use_ivr=false
zcu_immediate_response=false
snapshot_interval=60
use_snapshot=false

[Router]
routing_algorithm = ai

[AI]
alpha = 0.05
lamda_1 = 0.8
lamda_2 = 50
gamma = 1
tau = 3.0
gqd_threshold = 0.5
use_cache = false
is_abnormal_sign = false
q_history_size = 50
proc_num = 1
use_init_thread = true

[Dispatcher]
dispatch_algorithm=ai
preassign_orders=true
order_change=true
order_swap_range=10
order_sort=weighted_tuple
duration_weight=0.5
priority_weight=0.5
dispatch_limit=0
use_thread_dispatcher=false
use_log=false
order_chage_threadhold=1.5
use_carrier_check=false
zcu_order_change=false
use_stage=true

[MCS]
host_mode=host
secs_communication=true
tscstate_auto_when_has_disconnected=false
report_manual_order_event=true
tsc_pause_if_offline=true

[IVR]
ivr_period=300
dest_is_join=true
ivr_smoothing_factor=0.1